name: Daily Q&A analysis

on:
  # Paused to prevent automatic Q&A report commits from triggering production deployments.
  # Re-enable by restoring the schedule trigger.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Check London run time
        id: london_time
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hour="$(TZ=Europe/London date +%H)"
          if [ "$hour" = "23" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.london_time.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.london_time.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        if: steps.london_time.outputs.should_run == 'true'
        run: npm ci

      - name: Generate Q&A notes
        if: steps.london_time.outputs.should_run == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/run-qa-analysis.js

      - name: Commit Q&A notes
        if: steps.london_time.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/qa-analysis/*.md
          if git diff --cached --quiet; then
            echo "No Q&A analysis changes to commit."
          else
            git commit -m "Add daily Q&A analysis"
            git push
          fi
