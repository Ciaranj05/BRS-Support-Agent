<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>BRS Survey Metrics</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; background: #f6f8fb; color: #172033; }
    .shell { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 30px 0 42px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 26px; }
    .brand { display: flex; align-items: center; gap: 14px; }
    .mark { width: 42px; height: 42px; border-radius: 10px; background: #111827; color: white; display: grid; place-items: center; font-weight: 900; }
    h1 { font-size: 24px; margin: 0; letter-spacing: 0; }
    .sub { margin-top: 4px; color: #64748b; font-size: 14px; }
    button { min-height: 40px; border: 0; border-radius: 8px; background: #111827; color: white; font-weight: 800; padding: 0 14px; cursor: pointer; }
    .filter-panel { display: flex; justify-content: space-between; align-items: end; gap: 14px; background: white; border: 1px solid #e2e8f0; border-radius: 8px; padding: 16px; margin-bottom: 18px; }
    .filters { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
    .field { display: grid; gap: 6px; color: #475569; font-size: 12px; font-weight: 800; text-transform: uppercase; }
    input[type="date"] { min-height: 40px; border: 1px solid #cbd5e1; border-radius: 8px; padding: 0 10px; color: #172033; font: inherit; }
    .ghost-btn { background: white; color: #111827; border: 1px solid #cbd5e1; }
    .cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 22px; }
    .card { background: white; border: 1px solid #e2e8f0; border-radius: 8px; padding: 18px; }
    .label { color: #64748b; font-size: 12px; font-weight: 800; text-transform: uppercase; }
    .value { margin-top: 8px; font-size: 30px; font-weight: 900; }
    .panel { background: white; border: 1px solid #e2e8f0; border-radius: 8px; padding: 18px; margin-bottom: 22px; }
    .panel h2 { margin: 0 0 16px; font-size: 17px; }
    .score-grid { display: grid; grid-template-columns: repeat(11, minmax(0, 1fr)); gap: 8px; align-items: end; min-height: 190px; }
    .bar-wrap { display: grid; grid-template-rows: 1fr auto auto; gap: 7px; height: 170px; text-align: center; color: #475569; font-size: 12px; font-weight: 800; }
    .bar-track { display: flex; align-items: end; justify-content: center; height: 126px; border-bottom: 1px solid #e2e8f0; }
    .bar { width: 100%; max-width: 34px; min-height: 2px; border-radius: 6px 6px 0 0; background: #2563eb; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 12px 10px; border-bottom: 1px solid #e2e8f0; text-align: left; vertical-align: top; }
    th { color: #475569; font-size: 12px; text-transform: uppercase; }
    .empty { color: #64748b; padding: 18px 0; }
    @media (max-width: 1100px) { .cards { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 820px) { .topbar, .filter-panel { align-items: flex-start; flex-direction: column; } .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } .score-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); } table { display: block; overflow-x: auto; white-space: nowrap; } }
    @media (max-width: 520px) { .cards { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main class="shell">
    <div class="topbar">
      <div class="brand">
        <div class="mark">B</div>
        <div>
          <h1>Survey Metrics</h1>
          <div class="sub">Resolved query volume and percentage feedback scores.</div>
        </div>
      </div>
      <button id="refreshBtn" onclick="loadMetrics()">Refresh</button>
    </div>

    <section class="filter-panel">
      <div class="filters">
        <label class="field">Start Date<input id="startDate" type="date"></label>
        <label class="field">End Date<input id="endDate" type="date"></label>
        <button onclick="loadMetrics()">Apply Range</button>
        <button class="ghost-btn" onclick="clearDateRange()">Clear</button>
      </div>
      <div id="rangeLabel" class="sub">Showing all dates</div>
    </section>

    <section class="cards">
      <div class="card"><div class="label">Total Queries</div><div id="totalQueries" class="value">-</div></div>
      <div class="card"><div class="label">Resolved</div><div id="totalResolved" class="value">-</div></div>
      <div class="card"><div class="label">Not Resolved</div><div id="totalNotResolved" class="value">-</div></div>
      <div class="card"><div class="label">Escalated</div><div id="totalEscalated" class="value">-</div></div>
      <div class="card"><div class="label">Responses</div><div id="totalResponses" class="value">-</div></div>
      <div class="card"><div class="label">Response Rate</div><div id="responseRate" class="value">-</div></div>
      <div class="card"><div class="label">Resolution Rate</div><div id="resolutionRate" class="value">-</div></div>
      <div class="card"><div class="label">Recommend GolfNow</div><div id="averageScore" class="value">-</div></div>
    </section>

    <section class="panel">
      <h2>Score Breakdown</h2>
      <div id="scoreGrid" class="score-grid"></div>
    </section>

    <section class="panel">
      <h2>Recent Resolved Queries</h2>
      <div id="recentTable"></div>
    </section>
  </main>

  <script>
    function esc(value) {
      return String(value ?? '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#039;');
    }

    function fmtDate(value) {
      return value ? new Date(value).toLocaleString() : '-';
    }

    function setText(id, value) {
      document.getElementById(id).textContent = value;
    }

    function getDateParams() {
      const params = new URLSearchParams();
      const startDate = document.getElementById('startDate').value;
      const endDate = document.getElementById('endDate').value;
      if (startDate) {
        params.set('startDate', startDate);
        params.set('startAt', new Date(`${startDate}T00:00:00`).toISOString());
      }
      if (endDate) {
        params.set('endDate', endDate);
        params.set('endAt', new Date(`${endDate}T23:59:59.999`).toISOString());
      }
      return params;
    }

    function setRangeLabel() {
      const startDate = document.getElementById('startDate').value;
      const endDate = document.getElementById('endDate').value;
      const label = startDate || endDate ? `${startDate || 'All'} to ${endDate || 'Today'}` : 'Showing all dates';
      setText('rangeLabel', label);
    }

    function clearDateRange() {
      document.getElementById('startDate').value = '';
      document.getElementById('endDate').value = '';
      loadMetrics();
    }

    function renderScoreGrid(scoreCounts) {
      const scores = Array.from({ length: 11 }, (_, index) => index * 10);
      const counts = scores.map((score) => Number(scoreCounts?.[String(score)] || 0));
      const max = Math.max(...counts, 1);
      document.getElementById('scoreGrid').innerHTML = counts.map((count, index) => {
        const score = scores[index];
        const height = Math.max(2, Math.round((count / max) * 118));
        return `<div class="bar-wrap"><div class="bar-track"><div class="bar" style="height:${height}px"></div></div><div>${count}</div><div>${score}%</div></div>`;
      }).join('');
    }

    function renderRecentTable(rows) {
      const host = document.getElementById('recentTable');
      if (!rows?.length) {
        host.innerHTML = '<div class="empty">No resolved queries have been recorded yet.</div>';
        return;
      }
      host.innerHTML = `<table><thead><tr><th>Resolved</th><th>Outcome</th><th>Session</th><th>Topic</th><th>Score</th><th>Comment</th></tr></thead><tbody>${rows.map((row) => `
        <tr>
          <td>${esc(fmtDate(row.resolvedAt))}</td>
          <td>${row.resolved === false ? 'Not resolved' : 'Resolved'}${row.escalated ? ' / Escalated' : ''}</td>
          <td>${esc(row.sessionId)}</td>
          <td>${esc(row.topic || '-')}</td>
          <td>${row.score === null || row.score === undefined ? '-' : `${row.score}%`}</td>
          <td>${esc(row.comment || row.outcomeComment || '')}</td>
        </tr>`).join('')}</tbody></table>`;
    }

    async function loadMetrics() {
      const refreshBtn = document.getElementById('refreshBtn');
      if (refreshBtn) {
        refreshBtn.disabled = true;
        refreshBtn.textContent = 'Refreshing';
      }
      const params = getDateParams();
      params.set('_', Date.now().toString());
      try {
        const response = await fetch(`/api/admin/survey-metrics?${params}`, { cache: 'no-store' });
        const data = await response.json();
        if (data.ok === false) throw new Error(data.error || 'Metrics request failed.');
        setRangeLabel();
        setText('totalQueries', data.totalQueries ?? data.totalResolved ?? 0);
        setText('totalResolved', data.totalResolved ?? 0);
        setText('totalNotResolved', data.totalNotResolved ?? 0);
        setText('totalEscalated', data.totalEscalated ?? 0);
        setText('totalResponses', data.totalSurveyResponses ?? 0);
        setText('responseRate', `${Math.round((data.responseRate || 0) * 100)}%`);
        setText('resolutionRate', `${Math.round((data.resolutionRate || 0) * 100)}%`);
        setText('averageScore', data.averageScore === null || data.averageScore === undefined ? '-' : `${data.averageScore}%`);
        renderScoreGrid(data.scoreCounts || {});
        renderRecentTable(data.recentResponses || []);
      } catch (error) {
        document.getElementById('recentTable').innerHTML = '<div class="empty">Unable to refresh survey metrics.</div>';
      } finally {
        if (refreshBtn) {
          refreshBtn.disabled = false;
          refreshBtn.textContent = 'Refresh';
        }
      }
    }

    loadMetrics();
  </script>
</body>
</html>
