<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>BRS Caddie</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='10' fill='%2336424e'/%3E%3Ctext x='50' y='59' font-size='38' text-anchor='middle' fill='white' font-family='Arial' font-weight='700'%3EBRS%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="assistant-processing.css">
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="brand">
        <div class="mark">BRS</div>
        <div>
          <div class="title">Caddie</div>
          <div class="subtitle">Support guidance for bookings, payments, memberships and admin queries.</div>
        </div>
      </div>
      <div class="status"><span class="dot"></span>Online</div>
    </div>

    <div id="chat" class="chat"></div>

    <div class="input-wrap">
      <div class="input">
        <input id="input" placeholder="Describe your issue..." onkeydown="handleKey(event)">
        <button id="sendBtn" onclick="send()">Send</button>
        <button class="reset-btn" onclick="resetChat()">New Issue</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script src="assistant-processing.js"></script>
</body>
</html>
