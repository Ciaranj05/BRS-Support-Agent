<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>BRS Support Agent</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230f172a'/%3E%3Ctext x='50' y='60' font-size='44' text-anchor='middle' fill='white' font-family='Arial' font-weight='700'%3EB%3C/text%3E%3C/svg%3E">
  <style>
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; background:linear-gradient(135deg,#eaf1fb,#f8fafc 52%,#eef2ff); color:#0f172a; display:flex; justify-content:center; align-items:center; padding:28px; }
    .app { width:100%; max-width:1080px; height:92vh; background:rgba(255,255,255,.9); border:1px solid rgba(255,255,255,.7); border-radius:32px; overflow:hidden; display:flex; flex-direction:column; box-shadow:0 30px 90px rgba(15,23,42,.16); }
    .header { padding:22px 26px; border-bottom:1px solid rgba(148,163,184,.28); display:flex; justify-content:space-between; align-items:center; background:rgba(255,255,255,.85); }
    .brand { display:flex; align-items:center; gap:14px; }
    .mark { width:46px; height:46px; border-radius:16px; background:linear-gradient(135deg,#111827,#334155); color:white; display:grid; place-items:center; font-weight:900; }
    .title { font-size:21px; font-weight:850; }
    .subtitle { color:#64748b; font-size:14px; margin-top:4px; }
    .status { display:inline-flex; align-items:center; gap:8px; background:#f0fdf4; border:1px solid #bbf7d0; color:#166534; padding:9px 13px; border-radius:999px; font-size:12px; font-weight:800; }
    .dot { width:8px; height:8px; border-radius:999px; background:#16a34a; box-shadow:0 0 0 5px rgba(22,163,74,.12); }
    .chat { flex:1; overflow:auto; padding:28px; background:linear-gradient(rgba(248,250,252,.88),rgba(248,250,252,.94)); }
    .msg-row { display:flex; margin-bottom:18px; }
    .user-row { justify-content:flex-end; }
    .bot-row { justify-content:flex-start; }
    .system-row { justify-content:center; }
    .msg-wrap { max-width:min(74%,720px); }
    .msg { border-radius:20px; font-size:15px; line-height:1.7; padding:18px 20px; box-shadow:0 16px 45px rgba(15,23,42,.08); }
    .user { background:linear-gradient(135deg,#111827,#1f2937); color:white; border-bottom-right-radius:7px; white-space:pre-wrap; }
    .bot { background:white; border:1px solid rgba(148,163,184,.28); border-bottom-left-radius:7px; color:#0f172a; }
    .bot p { margin:0 0 12px; }
    .bot ol,.bot ul { margin:10px 0 14px 22px; padding:0; }
    .bot li { margin-bottom:10px; padding-left:4px; }
    .bot a { color:#1d4ed8; font-weight:800; text-decoration:underline; text-underline-offset:3px; overflow-wrap:anywhere; }
    .source-link { margin-top:12px; }
    .source-link a { display:inline-block; font-size:16px; }
    .option-row { display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; }
    .option-btn { padding:10px 14px; min-height:40px; border-radius:999px; border:1px solid rgba(37,99,235,.28); background:#eff6ff; color:#1d4ed8; font-weight:800; cursor:pointer; }
    .resolution-card { background:white; border:1px solid rgba(148,163,184,.28); border-radius:18px; padding:14px 16px; box-shadow:0 14px 34px rgba(15,23,42,.07); color:#334155; }
    .resolution-title { font-weight:850; color:#0f172a; margin-bottom:4px; }
    .resolution-text { color:#64748b; font-size:13px; margin-bottom:12px; }
    .resolution-actions { display:flex; gap:10px; flex-wrap:wrap; }
    .resolution-actions button { min-height:38px; padding:0 14px; border-radius:999px; font-size:13px; }
    .solved-btn { background:#16a34a; color:white; }
    .escalate-btn { background:#fff7ed; color:#9a3412; border:1px solid #fed7aa; }
    .rating-row { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
    .rating-btn { min-width:38px; min-height:38px; border-radius:999px; background:#f8fafc; color:#0f172a; border:1px solid rgba(148,163,184,.35); padding:0 12px; }
    .session-divider { display:inline-flex; padding:9px 14px; border-radius:999px; background:#ecfdf5; color:#166534; border:1px solid #bbf7d0; font-size:13px; font-weight:850; }
    .typing { display:inline-flex; align-items:center; gap:6px; min-width:74px; }
    .typing span { width:8px; height:8px; border-radius:999px; background:#94a3b8; animation:typingBounce 1.05s infinite ease-in-out; }
    .typing span:nth-child(2) { animation-delay:.14s; }
    .typing span:nth-child(3) { animation-delay:.28s; }
    @keyframes typingBounce { 0%,80%,100% { transform:translateY(0); opacity:.42; } 40% { transform:translateY(-6px); opacity:1; } }
    .input-wrap { padding:16px; border-top:1px solid rgba(148,163,184,.28); background:rgba(255,255,255,.9); }
    .input { display:flex; gap:10px; padding:8px; border:1px solid rgba(148,163,184,.28); border-radius:20px; background:#f8fafc; }
    input { flex:1; padding:12px 14px; border-radius:14px; border:none; background:transparent; font-size:15px; outline:none; color:#0f172a; }
    button { padding:0 18px; border-radius:14px; border:none; background:#111827; color:white; font-weight:800; cursor:pointer; }
    button:disabled { opacity:.55; cursor:not-allowed; }
    .reset-btn { background:white; color:#0f172a; border:1px solid rgba(148,163,184,.28); }
    @media(max-width:720px){ body{padding:12px}.app{height:96vh;border-radius:24px}.header{align-items:flex-start;flex-direction:column;padding:18px}.chat{padding:18px}.msg-wrap{max-width:90%}.input{flex-wrap:wrap}input{min-width:100%}button{min-height:42px;flex:1}.option-btn{flex:1 1 100%}.resolution-actions button{flex:1 1 100%}.rating-btn{flex:0 0 auto} }
  </style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="brand"><div class="mark">B</div><div><div class="title">BRS Support Agent</div><div class="subtitle">Support guidance for bookings, payments, memberships and admin queries.</div></div></div>
    <div class="status"><span class="dot"></span>Support Agent Online</div>
  </div>
  <div id="chat" class="chat"></div>
  <div class="input-wrap"><div class="input"><input id="input" placeholder="Describe the customer issue..." onkeydown="handleKey(event)"><button id="sendBtn" onclick="send()">Send</button><button class="reset-btn" onclick="resetChat()">New Issue</button></div></div>
</div>
<script>
const sessionId=localStorage.getItem('brsSupportSessionId')||crypto.randomUUID();
localStorage.setItem('brsSupportSessionId',sessionId);
let isSending=false, typingRow=null, activeOptionRow=null, activeResolutionRow=null, activeRatingRow=null, pendingFreeTextClarification=false;
function esc(t){return String(t||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
function renderInlineMarkdown(t){let safe=esc(t);const links=[];safe=safe.replace(/Source:\s*\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g,(m,label,url)=>{const i=links.push('<div class="source-link"><a href="'+url+'" target="_blank" rel="noopener noreferrer">'+label+'</a></div>')-1;return '__BRS_LINK_'+i+'__'});safe=safe.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g,(m,label,url)=>{const i=links.push('<a href="'+url+'" target="_blank" rel="noopener noreferrer">'+label+'</a>')-1;return '__BRS_LINK_'+i+'__'});safe=safe.replace(/\b(https?:\/\/[^\s<]+)\b/g,(url)=>{const i=links.push('<a href="'+url+'" target="_blank" rel="noopener noreferrer">'+url+'</a>')-1;return '__BRS_LINK_'+i+'__'});safe=safe.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>');return safe.replace(/__BRS_LINK_(\d+)__/g,(m,i)=>links[Number(i)]||m)}
function formatBotMessage(text){const lines=String(text||'').split('\n');let html='',ol=false,ul=false;function close(){if(ol){html+='</ol>';ol=false}if(ul){html+='</ul>';ul=false}}for(const line of lines){const x=line.trim();if(!x)continue;if(/^\d+\.\s+/.test(x)){if(ul){html+='</ul>';ul=false}if(!ol){html+='<ol>';ol=true}html+='<li>'+renderInlineMarkdown(x.replace(/^\d+\.\s+/,''))+'</li>';continue}if(/^[-•]\s+/.test(x)){if(ol){html+='</ol>';ol=false}if(!ul){html+='<ul>';ul=true}html+='<li>'+renderInlineMarkdown(x.replace(/^[-•]\s+/,''))+'</li>';continue}close();html+='<p>'+renderInlineMarkdown(x)+'</p>'}close();return html||'<p>'+renderInlineMarkdown(text||'')+'</p>'}
function addWelcome(){addMessage('Hi — what can I help you with today?\n\nTell me what the customer is trying to do, or what has gone wrong, and I will guide the next best step.','bot',[])}
function disableRows(){if(activeResolutionRow)activeResolutionRow.querySelectorAll('button').forEach(b=>b.disabled=true);if(activeOptionRow)activeOptionRow.querySelectorAll('button').forEach(b=>b.disabled=true);if(activeRatingRow)activeRatingRow.querySelectorAll('button').forEach(b=>b.disabled=true)}
function addSystemDivider(text){const chat=document.getElementById('chat');const row=document.createElement('div');row.className='msg-row system-row';row.innerHTML='<div class="session-divider">'+esc(text)+'</div>';chat.appendChild(row);chat.scrollTop=chat.scrollHeight}
function addResolutionPrompt(){if(activeResolutionRow)activeResolutionRow.remove();const chat=document.getElementById('chat');const row=document.createElement('div');row.className='msg-row bot-row';row.innerHTML='<div class="msg-wrap"><div class="resolution-card"><div class="resolution-title">Did this answer the question?</div><div class="resolution-text">Mark it solved or escalate if further support is needed.</div><div class="resolution-actions"><button class="solved-btn" onclick="showRatingPrompt()">✓ Solved</button><button class="escalate-btn" onclick="escalateSession()">Escalate</button></div></div></div>';chat.appendChild(row);activeResolutionRow=row;chat.scrollTop=chat.scrollHeight}
function showRatingPrompt(){disableRows();const chat=document.getElementById('chat');const row=document.createElement('div');row.className='msg-row bot-row';const wrap=document.createElement('div');wrap.className='msg-wrap';const card=document.createElement('div');card.className='resolution-card';card.innerHTML='<div class="resolution-title">How would you rate this answer?</div><div class="resolution-text">Select a score from 0 to 10.</div>';const rating=document.createElement('div');rating.className='rating-row';for(let i=0;i<=10;i++){const b=document.createElement('button');b.className='rating-btn';b.type='button';b.textContent=String(i);b.onclick=()=>submitRating(i);rating.appendChild(b)}card.appendChild(rating);wrap.appendChild(card);row.appendChild(wrap);chat.appendChild(row);activeRatingRow=row;chat.scrollTop=chat.scrollHeight}
async function submitRating(score){disableRows();try{await fetch('/api/feedback',{method:'POST',headers:{'Content-Type':'application/json','x-session-id':sessionId},body:JSON.stringify({score,type:'nps'})}).catch(()=>{})}finally{await fetch('/api/reset',{method:'POST',headers:{'x-session-id':sessionId}}).catch(()=>{});addSystemDivider('Thank you for your feedback. Starting fresh for the next issue.');setTimeout(()=>resetChat(),1600)}}
function escalateSession(){disableRows();addMessage('Please add any missing customer details, then continue with what needs escalating.','bot',[]);document.getElementById('input').focus()}
function isFreeTextOption(label,value){const text=(String(label||'')+' '+String(value||'')).toLowerCase();return text.includes('type details')||text.includes('not sure')||text.includes('type more details')}
function startFreeTextClarification(label){disableRows();pendingFreeTextClarification=true;addMessage(label,'user');addMessage('No problem. Type what the customer is trying to do. Helpful details: is it for a member, a staff/admin user, a booking, a payment, or a membership/billing task?','bot',[]);const input=document.getElementById('input');input.disabled=false;input.focus()}
function buildClarificationPayload(message){return 'Clarification answer: '+message}
function addMessage(text,sender='bot',opts=[]){const chat=document.getElementById('chat');const row=document.createElement('div');row.className='msg-row '+(sender==='user'?'user-row':'bot-row');const wrap=document.createElement('div');wrap.className='msg-wrap';const div=document.createElement('div');div.className='msg '+sender;div.innerHTML=sender==='bot'?formatBotMessage(text):esc(text);const options=sender==='bot'&&Array.isArray(opts)?opts:[];if(options.length){const optionRow=document.createElement('div');optionRow.className='option-row';let freeTextAdded=false;for(const o of options){let label=o.label||String(o);let value=o.value||label;if(isFreeTextOption(label,value)){if(freeTextAdded)continue;freeTextAdded=true;label="I'm not sure / type details";value='Clarification answer: I need to type details instead'}const b=document.createElement('button');b.className='option-btn';b.type='button';b.textContent=label;b.onclick=()=>isFreeTextOption(label,value)?startFreeTextClarification(label):send(value,label);optionRow.appendChild(b)}div.appendChild(optionRow);activeOptionRow=optionRow}wrap.appendChild(div);row.appendChild(wrap);chat.appendChild(row);chat.scrollTop=chat.scrollHeight;return options.length}
function showTyping(){removeTyping();const chat=document.getElementById('chat');typingRow=document.createElement('div');typingRow.className='msg-row bot-row';typingRow.innerHTML='<div class="msg-wrap"><div class="msg bot typing"><span></span><span></span><span></span></div></div>';chat.appendChild(typingRow);chat.scrollTop=chat.scrollHeight}
function removeTyping(){if(typingRow){typingRow.remove();typingRow=null}}
function handleKey(e){if(e.key==='Enter')send()}
async function send(m=null,d=null){if(isSending)return;const input=document.getElementById('input');const typed=m||input.value.trim();if(!typed)return;const message=pendingFreeTextClarification&&!m?buildClarificationPayload(typed):typed;pendingFreeTextClarification=false;disableRows();addMessage(d||typed,'user');input.value='';isSending=true;document.getElementById('sendBtn').disabled=true;input.disabled=true;showTyping();try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json','x-session-id':sessionId},body:JSON.stringify({message})});const data=await r.json();removeTyping();const optionCount=addMessage(data.reply||'No response received.','bot',data.options||[]);if(!optionCount&&!data.escalationReady)addResolutionPrompt()}catch(e){removeTyping();addMessage('There was a problem sending your message. Please try again.','bot')}isSending=false;document.getElementById('sendBtn').disabled=false;input.disabled=false;input.focus()}
function resetChat(){removeTyping();document.getElementById('chat').innerHTML='';activeOptionRow=null;activeResolutionRow=null;activeRatingRow=null;pendingFreeTextClarification=false;addWelcome();fetch('/api/reset',{method:'POST',headers:{'x-session-id':sessionId}}).catch(()=>{})}
addWelcome();
</script>
</body>
</html>
