<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>BRS Support Agent</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230f172a'/%3E%3Ctext x='50' y='60' font-size='44' text-anchor='middle' fill='white' font-family='Arial' font-weight='700'%3EB%3C/text%3E%3C/svg%3E">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; background: linear-gradient(135deg,#eaf1fb,#f8fafc 52%,#eef2ff); color: #0f172a; display:flex; justify-content:center; align-items:center; padding:28px; }
    .app { width: 100%; max-width: 1080px; height: 92vh; background: rgba(255,255,255,.9); border: 1px solid rgba(255,255,255,.7); border-radius: 32px; overflow: hidden; display:flex; flex-direction:column; box-shadow: 0 30px 90px rgba(15,23,42,.16); backdrop-filter: blur(18px); }
    .header { padding: 22px 26px; border-bottom: 1px solid rgba(148,163,184,.28); display:flex; justify-content:space-between; align-items:center; background: rgba(255,255,255,.85); }
    .brand { display:flex; align-items:center; gap:14px; }
    .mark { width:46px; height:46px; border-radius:16px; background:linear-gradient(135deg,#111827,#334155); color:#fff; display:grid; place-items:center; font-weight:900; box-shadow:0 12px 28px rgba(15,23,42,.22); }
    .title { font-size: 21px; font-weight: 850; letter-spacing:-.02em; }
    .subtitle { color:#64748b; font-size:14px; margin-top:4px; }
    .status { display:inline-flex; align-items:center; gap:8px; background:#f0fdf4; border:1px solid #bbf7d0; color:#166534; padding:9px 13px; border-radius:999px; font-size:12px; font-weight:800; }
    .dot { width:8px; height:8px; border-radius:999px; background:#16a34a; box-shadow:0 0 0 5px rgba(22,163,74,.12); }
    .chat { flex:1; overflow:auto; padding:28px; background:linear-gradient(rgba(248,250,252,.88),rgba(248,250,252,.94)); }
    .welcome-card { background:#fff; border:1px solid rgba(148,163,184,.28); border-radius:24px; padding:22px; margin-bottom:26px; box-shadow:0 16px 45px rgba(15,23,42,.08); }
    .welcome-card h2 { margin:0 0 8px; letter-spacing:-.03em; }
    .welcome-card p { margin:0; color:#64748b; line-height:1.6; }
    .msg-row { display:flex; margin-bottom:18px; animation: slideIn 180ms ease-out; }
    .user-row { justify-content:flex-end; }
    .bot-row { justify-content:flex-start; }
    .msg-wrap { max-width:min(74%,720px); }
    .msg { border-radius:20px; font-size:15px; line-height:1.7; padding:18px 20px; box-shadow:0 16px 45px rgba(15,23,42,.08); }
    .user { background:linear-gradient(135deg,#111827,#1f2937); color:white; border-bottom-right-radius:7px; white-space:pre-wrap; }
    .bot { background:white; border:1px solid rgba(148,163,184,.28); border-bottom-left-radius:7px; color:#0f172a; }
    .bot p { margin:0 0 12px; }
    .bot ol, .bot ul { margin:10px 0 14px 22px; padding:0; }
    .bot li { margin-bottom:10px; padding-left:4px; }
    .bot a { color:#1d4ed8; font-weight:800; text-decoration:underline; text-underline-offset:3px; overflow-wrap:anywhere; }
    .bot a:hover { color:#1e40af; }
    .option-row { display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; }
    .option-btn { padding:10px 14px; min-height:40px; border-radius:999px; border:1px solid rgba(37,99,235,.28); background:#eff6ff; color:#1d4ed8; font-weight:800; cursor:pointer; }
    .option-btn:hover { background:#dbeafe; transform:translateY(-1px); }
    .typing { display:inline-flex; align-items:center; gap:6px; min-width:74px; }
    .typing span { width:8px; height:8px; border-radius:999px; background:#94a3b8; animation:bounce 1.1s infinite ease-in-out; }
    .typing span:nth-child(2){ animation-delay:.15s; } .typing span:nth-child(3){ animation-delay:.3s; }
    .input-wrap { padding:16px; border-top:1px solid rgba(148,163,184,.28); background:rgba(255,255,255,.9); }
    .input { display:flex; gap:10px; padding:8px; border:1px solid rgba(148,163,184,.28); border-radius:20px; background:#f8fafc; }
    input { flex:1; padding:12px 14px; border-radius:14px; border:none; background:transparent; font-size:15px; outline:none; color:#0f172a; }
    button { padding:0 18px; border-radius:14px; border:none; background:#111827; color:#fff; font-weight:800; cursor:pointer; }
    button:disabled { opacity:.55; cursor:not-allowed; }
    .reset-btn { background:#fff; color:#0f172a; border:1px solid rgba(148,163,184,.28); }
    @keyframes bounce { 0%,80%,100%{transform:translateY(0);opacity:.45} 40%{transform:translateY(-5px);opacity:1} }
    @keyframes slideIn { from{transform:translateY(6px);opacity:0} to{transform:translateY(0);opacity:1} }
    @media(max-width:720px){ body{padding:12px}.app{height:96vh;border-radius:24px}.header{align-items:flex-start;flex-direction:column;padding:18px}.chat{padding:18px}.msg-wrap{max-width:90%}.input{flex-wrap:wrap}input{min-width:100%}button{min-height:42px;flex:1}.option-btn{flex:1 1 100%} }
  </style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="brand"><div class="mark">B</div><div><div class="title">BRS Support Agent</div><div class="subtitle">Support guidance for bookings, payments, memberships and admin queries.</div></div></div>
    <div class="status"><span class="dot"></span>Support Agent Online</div>
  </div>
  <div id="chat" class="chat"></div>
  <div class="input-wrap"><div class="input"><input id="input" placeholder="Describe the customer issue..." onkeydown="handleKey(event)"><button id="sendBtn" onclick="send()">Send</button><button class="reset-btn" onclick="resetChat()">New Issue</button></div></div>
</div>
<script>
const sessionId=localStorage.getItem('brsSupportSessionId')||crypto.randomUUID();localStorage.setItem('brsSupportSessionId',sessionId);let isSending=false;let typingRow=null;let activeOptionRow=null;
function esc(t){return String(t||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
function renderInlineMarkdown(t){return esc(t).replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')}
function formatBotMessage(text){const lines=String(text||'').split('\n');let html='';let ol=false,ul=false;function close(){if(ol){html+='</ol>';ol=false}if(ul){html+='</ul>';ul=false}}lines.forEach(line=>{const x=line.trim();if(!x)return;if(/^\d+\.\s+/.test(x)){if(ul){html+='</ul>';ul=false}if(!ol){html+='<ol>';ol=true}html+='<li>'+renderInlineMarkdown(x.replace(/^\d+\.\s+/,''))+'</li>';return}if(/^[-\u2022]\s+/.test(x)){if(ol){html+='</ol>';ol=false}if(!ul){html+='<ul>';ul=true}html+='<li>'+renderInlineMarkdown(x.replace(/^[-\u2022]\s+/,''))+'</li>';return}close();html+='<p>'+renderInlineMarkdown(x)+'</p>'});close();return html||'<p>'+renderInlineMarkdown(text||'')+'</p>'}
function titleCase(s){return String(s||'').trim().replace(/\s+/g,' ').replace(/\b\w/g,c=>c.toUpperCase())}
function extractOptions(t){const m=String(t||'').match(/[^.!?\n][^?\n]*\?/g);if(!m)return[];const q=m[m.length-1].trim();const lower=q.toLowerCase();if(/full refund.*partial refund|partial refund.*full refund/i.test(q))return['Full Refund','Partial Refund'];if(/yes\s+or\s+no|yes\/no/i.test(q))return['Yes','No'];if(/^(have|has|is|are|was|were|do|does|did|can|could|should|will|would)\b/i.test(lower)&&!/\s+or\s+|,/.test(lower))return['Yes','No'];let source=q.replace(/[?]$/,'').replace(/^(is this|is it|are you|do you want to|are you trying to|are you looking to|do you need to|are you asking about|do you mean)\s+(about\s+)?/i,'');const colon=q.match(/(?:which|what)\s+[^:]{0,140}:\s*(.+)$/i);if(colon)source=colon[1];if(/\s+or\s+|,/.test(source)){return source.replace(/\b(or something else|or another issue|or other)\b/gi,', something else').split(/\s*,\s*|\s+or\s+|\s*\/\s*/i).map(x=>x.trim().replace(/^(a|an|the|adding|creating|setting up|checking|reviewing)\s+/i,'')).filter(Boolean).slice(0,8).map(titleCase)}return[]}
function addWelcome(){const chat=document.getElementById('chat');const card=document.createElement('div');card.className='welcome-card';card.innerHTML='<h2>How can we help today?</h2><p>Describe the issue and we\u2019ll guide the next best step. If needed, we can prepare an escalation draft for support.</p>';chat.appendChild(card)}
function addMessage(text,sender='bot',opts=[]){const chat=document.getElementById('chat');const row=document.createElement('div');row.className='msg-row '+(sender==='user'?'user-row':'bot-row');const wrap=document.createElement('div');wrap.className='msg-wrap';const div=document.createElement('div');div.className='msg '+sender;div.innerHTML=sender==='bot'?formatBotMessage(text):esc(text);const options=sender==='bot'?(opts.length?opts:extractOptions(text)):[];if(options.length){const optionRow=document.createElement('div');optionRow.className='option-row';options.forEach(o=>{const label=o.label||o;const value=o.value||o.label||o;const b=document.createElement('button');b.className='option-btn';b.type='button';b.textContent=label;b.onclick=()=>send(value,label);optionRow.appendChild(b)});div.appendChild(optionRow);activeOptionRow=optionRow}wrap.appendChild(div);row.appendChild(wrap);chat.appendChild(row);chat.scrollTop=chat.scrollHeight}
function showTyping(){removeTyping();const chat=document.getElementById('chat');typingRow=document.createElement('div');typingRow.className='msg-row bot-row';typingRow.innerHTML='<div class="msg-wrap"><div class="msg bot typing"><span></span><span></span><span></span></div></div>';chat.appendChild(typingRow);chat.scrollTop=chat.scrollHeight}
function removeTyping(){if(typingRow){typingRow.remove();typingRow=null}}
function handleKey(e){if(e.key==='Enter')send()}
async function send(m=null,d=null){if(isSending)return;const input=document.getElementById('input');const message=m||input.value.trim();if(!message)return;if(activeOptionRow)activeOptionRow.querySelectorAll('button').forEach(b=>b.disabled=true);addMessage(d||message,'user');input.value='';isSending=true;document.getElementById('sendBtn').disabled=true;input.disabled=true;showTyping();try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json','x-session-id':sessionId},body:JSON.stringify({message})});const data=await r.json();removeTyping();addMessage(data.reply||'No response received.','bot',data.options||[])}catch(e){removeTyping();addMessage('There was a problem sending your message. Please try again.','bot')}isSending=false;document.getElementById('sendBtn').disabled=false;input.disabled=false;input.focus()}
function resetChat(){removeTyping();document.getElementById('chat').innerHTML='';activeOptionRow=null;addWelcome();fetch('/api/reset',{method:'POST',headers:{'x-session-id':sessionId}}).catch(()=>{})}
addWelcome();
</script>
</body>
</html>
