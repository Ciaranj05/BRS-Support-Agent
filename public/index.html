<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>BRS Support Agent</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230f172a'/%3E%3Ctext x='50' y='60' font-size='44' text-anchor='middle' fill='white' font-family='Arial' font-weight='700'%3EB%3C/text%3E%3C/svg%3E">
  <style>
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; background:linear-gradient(135deg,#eaf1fb,#f8fafc 52%,#eef2ff); color:#0f172a; display:flex; justify-content:center; align-items:center; padding:28px; }
    .app { width:100%; max-width:1080px; height:92vh; background:rgba(255,255,255,.9); border:1px solid rgba(255,255,255,.7); border-radius:32px; overflow:hidden; display:flex; flex-direction:column; box-shadow:0 30px 90px rgba(15,23,42,.16); }
    .header { padding:22px 26px; border-bottom:1px solid rgba(148,163,184,.28); display:flex; justify-content:space-between; align-items:center; background:rgba(255,255,255,.85); }
    .brand { display:flex; align-items:center; gap:14px; }
    .mark { width:46px; height:46px; border-radius:16px; background:linear-gradient(135deg,#111827,#334155); color:white; display:grid; place-items:center; font-weight:900; box-shadow:0 12px 28px rgba(15,23,42,.22); }
    .title { font-size:21px; font-weight:850; }
    .subtitle { color:#64748b; font-size:14px; margin-top:4px; }
    .status { display:inline-flex; align-items:center; gap:8px; background:#f0fdf4; border:1px solid #bbf7d0; color:#166534; padding:9px 13px; border-radius:999px; font-size:12px; font-weight:800; }
    .dot { width:8px; height:8px; border-radius:999px; background:#16a34a; box-shadow:0 0 0 5px rgba(22,163,74,.12); }
    .chat { flex:1; overflow:auto; padding:28px 28px 34px; background:linear-gradient(rgba(248,250,252,.88),rgba(248,250,252,.94)); }
    .msg-row { display:flex; margin-bottom:18px; }
    .user-row { justify-content:flex-end; }
    .bot-row { justify-content:flex-start; }
    .system-row { justify-content:center; }
    .msg-wrap { max-width:min(74%,720px); }
    .msg { border-radius:20px; font-size:15px; line-height:1.7; padding:18px 20px; box-shadow:0 16px 45px rgba(15,23,42,.08); }
    .user { background:linear-gradient(135deg,#111827,#1f2937); color:white; border-bottom-right-radius:7px; white-space:pre-wrap; }
    .bot { background:white; border:1px solid rgba(148,163,184,.28); border-bottom-left-radius:7px; color:#0f172a; }
    .bot.typing-text { white-space:pre-wrap; }
    .bot.opening { position:relative; overflow:hidden; padding:0; border-radius:26px; border:1px solid rgba(148,163,184,.26); box-shadow:0 24px 70px rgba(15,23,42,.10); }
    .bot.opening::before { content:""; position:absolute; inset:0 0 auto 0; height:5px; background:linear-gradient(90deg,#0f172a,#2563eb,#22c55e); }
    .opening-inner { padding:24px 26px 22px; }
    .opening-kicker { display:inline-flex; align-items:center; gap:8px; color:#2563eb; background:#eff6ff; border:1px solid #bfdbfe; border-radius:999px; padding:6px 10px; font-size:12px; font-weight:850; margin-bottom:14px; }
    .opening-title { font-size:22px; line-height:1.25; font-weight:900; letter-spacing:-.03em; color:#0f172a; margin-bottom:8px; }
    .opening-copy { color:#475569; font-size:15px; line-height:1.65; max-width:620px; }
    .bot p { margin:0 0 12px; }
    .bot ol,.bot ul { margin:10px 0 14px 22px; padding:0; }
    .bot li { margin-bottom:10px; padding-left:4px; }
    .bot a { color:#1d4ed8; font-weight:800; text-decoration:underline; text-underline-offset:3px; overflow-wrap:anywhere; }
    .source-link { margin-top:12px; }
    .source-link a { display:inline-block; font-size:16px; }
    .option-row { display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; }
    .option-btn { padding:10px 14px; min-height:40px; border-radius:999px; border:1px solid rgba(37,99,235,.28); background:#eff6ff; color:#1d4ed8; font-weight:800; cursor:pointer; }
    .resolution-card { background:white; border:1px solid rgba(148,163,184,.28); border-radius:18px; padding:14px 16px; box-shadow:0 14px 34px rgba(15,23,42,.07); color:#334155; }
    .resolution-title { font-weight:850; color:#0f172a; margin-bottom:4px; }
    .resolution-text { color:#64748b; font-size:13px; margin-bottom:12px; }
    .resolution-actions { display:flex; gap:10px; flex-wrap:wrap; }
    .resolution-actions button { min-height:38px; padding:0 14px; border-radius:999px; font-size:13px; }
    .solved-btn { background:#16a34a; color:white; }
    .escalate-btn { background:#fff7ed; color:#9a3412; border:1px solid #fed7aa; }
    .rating-row { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
    .rating-btn { min-width:38px; min-height:38px; border-radius:999px; background:#f8fafc; color:#0f172a; border:1px solid rgba(148,163,184,.35); padding:0 12px; }
    .rating-btn.selected { background:#111827; color:white; border-color:#111827; }
    .feedback-comment { width:100%; min-height:82px; margin-top:12px; padding:11px 12px; border-radius:12px; border:1px solid rgba(148,163,184,.35); background:#f8fafc; color:#0f172a; font:inherit; line-height:1.45; resize:vertical; outline:none; }
    .feedback-submit { margin-top:10px; min-height:38px; border-radius:999px; font-size:13px; }
    .session-divider { display:inline-flex; padding:9px 14px; border-radius:999px; background:#ecfdf5; color:#166534; border:1px solid #bbf7d0; font-size:13px; font-weight:850; }
    .typing { display:inline-flex; align-items:center; gap:6px; min-width:74px; }
    .typing span { width:8px; height:8px; border-radius:999px; background:#94a3b8; animation:typingBounce 1.05s infinite ease-in-out; }
    .typing span:nth-child(2) { animation-delay:.14s; }
    .typing span:nth-child(3) { animation-delay:.28s; }
    @keyframes typingBounce { 0%,80%,100% { transform:translateY(0); opacity:.42; } 40% { transform:translateY(-6px); opacity:1; } }
    .input-wrap { padding:16px; border-top:1px solid rgba(148,163,184,.28); background:rgba(255,255,255,.9); }
    .input { display:flex; gap:10px; padding:8px; border:1px solid rgba(148,163,184,.28); border-radius:20px; background:#f8fafc; }
    input { flex:1; padding:12px 14px; border-radius:14px; border:none; background:transparent; font-size:15px; outline:none; color:#0f172a; }
    button { padding:0 18px; border-radius:14px; border:none; background:#111827; color:white; font-weight:800; cursor:pointer; }
    button:disabled { opacity:.55; cursor:not-allowed; }
    .reset-btn { background:white; color:#0f172a; border:1px solid rgba(148,163,184,.28); }
    @media(max-width:720px){ body{padding:12px}.app{height:96vh;border-radius:24px}.header{align-items:flex-start;flex-direction:column;padding:18px}.chat{padding:18px}.msg-wrap{max-width:94%}.input{flex-wrap:wrap}input{min-width:100%}button{min-height:42px;flex:1}.option-btn{flex:1 1 100%}.resolution-actions button{flex:1 1 100%}.rating-btn{flex:0 0 auto}.opening-title{font-size:19px} }
  </style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="brand"><div class="mark">B</div><div><div class="title">BRS Support Agent</div><div class="subtitle">Support guidance for bookings, payments, memberships and admin queries.</div></div></div>
    <div class="status"><span class="dot"></span>Support Agent Online</div>
  </div>
  <div id="chat" class="chat"></div>
  <div class="input-wrap"><div class="input"><input id="input" placeholder="Describe the customer issue..." onkeydown="handleKey(event)"><button id="sendBtn" onclick="send()">Send</button><button class="reset-btn" onclick="resetChat()">New Issue</button></div></div>
</div>
<script>
let sessionId=localStorage.getItem('brsSupportSessionId')||crypto.randomUUID();
localStorage.setItem('brsSupportSessionId',sessionId);
let isSending=false, typingRow=null, activeOptionRow=null, activeResolutionRow=null, activeRatingRow=null, pendingFreeTextClarification=false, pendingRatingScore=null, pendingFollowUpHint='';
function esc(t){return String(t||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
function renderInlineMarkdown(t){let safe=esc(t);const links=[];safe=safe.replace(/Source:\s*\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g,(m,label,url)=>{const i=links.push('<div class="source-link"><a href="'+url+'" target="_blank" rel="noopener noreferrer">'+label+'</a></div>')-1;return '__BRS_LINK_'+i+'__'});safe=safe.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g,(m,label,url)=>{const i=links.push('<a href="'+url+'" target="_blank" rel="noopener noreferrer">'+label+'</a>')-1;return '__BRS_LINK_'+i+'__'});safe=safe.replace(/\b(https?:\/\/[^\s<]+)\b/g,(url)=>{const i=links.push('<a href="'+url+'" target="_blank" rel="noopener noreferrer">'+url+'</a>')-1;return '__BRS_LINK_'+i+'__'});safe=safe.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>');return safe.replace(/__BRS_LINK_(\d+)__/g,(m,i)=>links[Number(i)]||m)}
function formatBotMessage(text){const lines=String(text||'').split('\n');let html='',ol=false,ul=false;function close(){if(ol){html+='</ol>';ol=false}if(ul){html+='</ul>';ul=false}}for(const line of lines){const x=line.trim();if(!x)continue;if(/^\d+\.\s+/.test(x)){if(ul){html+='</ul>';ul=false}if(!ol){html+='<ol>';ol=true}html+='<li>'+renderInlineMarkdown(x.replace(/^\d+\.\s+/,''))+'</li>';continue}if(/^[-•]\s+/.test(x)){if(ol){html+='</ol>';ol=false}if(!ul){html+='<ul>';ul=true}html+='<li>'+renderInlineMarkdown(x.replace(/^[-•]\s+/,''))+'</li>';continue}close();html+='<p>'+renderInlineMarkdown(x)+'</p>'}close();return html||'<p>'+renderInlineMarkdown(text||'')+'</p>'}
function hasPriorUserMessage(){return Boolean(document.querySelector('.user-row'))}
function looksLikeStandaloneQuestion(text){const lower=String(text||'').trim().toLowerCase();if(!lower)return false;const words=lower.split(/\s+/).filter(Boolean);if(words.length<4)return false;return /^(how|what|why|where|when|can|could|do|does|is|are|i need|help|please)\b/.test(lower)}
function wantsNewQuestion(text){const lower=String(text||'').trim().toLowerCase();return /\b(another|new|next|different|separate)\s+(question|issue|query)\b/.test(lower)||/\b(ask|start)\s+(something\s+else|again|over)\b/.test(lower)||/\bnew issue\b/.test(lower)}
function extractNewQuestion(text){const raw=String(text||'').trim();const match=raw.match(/(?:another|new|next|different|separate)\s+(?:question|issue|query)\s*[:,-]?\s*(.+)$/i);const next=match?.[1]?.trim()||'';return next.split(/\s+/).filter(Boolean).length>=3?next:''}
function startFreshSessionForRootQuestion(){disableRows();sessionId=crypto.randomUUID();localStorage.setItem('brsSupportSessionId',sessionId);activeOptionRow=null;activeResolutionRow=null;activeRatingRow=null;pendingFreeTextClarification=false;pendingFollowUpHint='';addSystemDivider('Starting a fresh context for this question.')}
function startFreshPromptForNextQuestion(text){disableRows();addMessage(text,'user');sessionId=crypto.randomUUID();localStorage.setItem('brsSupportSessionId',sessionId);activeOptionRow=null;activeResolutionRow=null;activeRatingRow=null;pendingFreeTextClarification=false;pendingFollowUpHint='';addSystemDivider('Starting a fresh context for the next question.');addWelcome()}
function addWelcome(){const chat=document.getElementById('chat');const row=document.createElement('div');row.className='msg-row bot-row';const wrap=document.createElement('div');wrap.className='msg-wrap';const div=document.createElement('div');div.className='msg bot opening';div.innerHTML='<div class="opening-inner"><div class="opening-kicker">● Ready to help</div><div class="opening-title">What can I help you with today?</div><div class="opening-copy">Type what the customer is trying to do, and I will narrow it down before giving the next step.</div></div>';wrap.appendChild(div);row.appendChild(wrap);chat.appendChild(row);chat.scrollTop=chat.scrollHeight}
function disableRows(){if(activeResolutionRow)activeResolutionRow.querySelectorAll('button').forEach(b=>b.disabled=true);if(activeOptionRow)activeOptionRow.querySelectorAll('button').forEach(b=>b.disabled=true);if(activeRatingRow)activeRatingRow.querySelectorAll('button').forEach(b=>b.disabled=true)}
function addSystemDivider(text){const chat=document.getElementById('chat');const row=document.createElement('div');row.className='msg-row system-row';row.innerHTML='<div class="session-divider">'+esc(text)+'</div>';chat.appendChild(row);chat.scrollTop=chat.scrollHeight}
function addResolutionPrompt(){if(activeResolutionRow)activeResolutionRow.remove();const chat=document.getElementById('chat');const row=document.createElement('div');row.className='msg-row bot-row';row.innerHTML='<div class="msg-wrap"><div class="resolution-card"><div class="resolution-title">Was this query resolved?</div><div class="resolution-text">Choose Yes to leave a recommendation score, or No to record an escalation.</div><div class="resolution-actions"><button class="solved-btn" onclick="showRatingPrompt()">Yes, resolved</button><button class="escalate-btn" onclick="showUnresolvedPrompt()">No, escalate</button></div></div></div>';chat.appendChild(row);activeResolutionRow=row;chat.scrollTop=chat.scrollHeight}
function showRatingPrompt(){disableRows();pendingRatingScore=null;const chat=document.getElementById('chat');const row=document.createElement('div');row.className='msg-row bot-row';const wrap=document.createElement('div');wrap.className='msg-wrap';const card=document.createElement('div');card.className='resolution-card';card.innerHTML='<div class="resolution-title">How likely are you to recommend GolfNow?</div><div class="resolution-text">Select 0% for not at all likely and 100% for extremely likely.</div>';const rating=document.createElement('div');rating.className='rating-row';for(let i=0;i<=100;i+=10){const b=document.createElement('button');b.className='rating-btn';b.type='button';b.textContent=String(i)+'%';b.onclick=()=>selectRating(i,b);rating.appendChild(b)}const comment=document.createElement('textarea');comment.id='feedbackComment';comment.className='feedback-comment';comment.placeholder='Add an optional comment...';const submit=document.createElement('button');submit.id='feedbackSubmit';submit.className='feedback-submit';submit.type='button';submit.textContent='Submit feedback';submit.disabled=true;submit.onclick=submitRating;card.appendChild(rating);card.appendChild(comment);card.appendChild(submit);wrap.appendChild(card);row.appendChild(wrap);chat.appendChild(row);activeRatingRow=row;chat.scrollTop=chat.scrollHeight}
function selectRating(score,button){pendingRatingScore=score;if(activeRatingRow)activeRatingRow.querySelectorAll('.rating-btn').forEach(b=>b.classList.remove('selected'));button.classList.add('selected');const submit=document.getElementById('feedbackSubmit');if(submit)submit.disabled=false}
async function submitRating(){if(pendingRatingScore===null)return;const comment=document.getElementById('feedbackComment')?.value||'';disableRows();try{await fetch('/api/feedback',{method:'POST',headers:{'Content-Type':'application/json','x-session-id':sessionId},body:JSON.stringify({score:pendingRatingScore,type:'nps',comment})}).catch(()=>{})}finally{await fetch('/api/reset',{method:'POST',headers:{'x-session-id':sessionId}}).catch(()=>{});addSystemDivider('Thank you for your feedback. Starting fresh for the next issue.');setTimeout(()=>resetChat(),1600)}}
function showUnresolvedPrompt(){disableRows();const chat=document.getElementById('chat');const row=document.createElement('div');row.className='msg-row bot-row';const wrap=document.createElement('div');wrap.className='msg-wrap';const card=document.createElement('div');card.className='resolution-card';card.innerHTML='<div class="resolution-title">What still needs help?</div><div class="resolution-text">Add an optional note for the escalation record.</div>';const comment=document.createElement('textarea');comment.id='unresolvedComment';comment.className='feedback-comment';comment.placeholder='Add escalation details...';const submit=document.createElement('button');submit.className='feedback-submit';submit.type='button';submit.textContent='Record escalation';submit.onclick=submitUnresolved;card.appendChild(comment);card.appendChild(submit);wrap.appendChild(card);row.appendChild(wrap);chat.appendChild(row);activeRatingRow=row;chat.scrollTop=chat.scrollHeight}
async function submitUnresolved(){const comment=document.getElementById('unresolvedComment')?.value||'';disableRows();try{await fetch('/api/resolved-interactions',{method:'POST',headers:{'Content-Type':'application/json','x-session-id':sessionId},body:JSON.stringify({resolved:false,escalated:true,comment})}).catch(()=>{})}finally{await fetch('/api/reset',{method:'POST',headers:{'x-session-id':sessionId}}).catch(()=>{});addSystemDivider('Escalation recorded. Starting fresh for the next issue.');setTimeout(()=>resetChat(),1600)}}
function escalateSession(){disableRows();addMessage('Please add any missing customer details, then continue with what needs escalating.','bot',[]);document.getElementById('input').focus()}
function isFreeTextOption(label,value){const text=(String(label||'')+' '+String(value||'')).toLowerCase();return text.includes('type details')||text.includes('not sure')||text.includes('type more details')}
function startFreeTextClarification(label){disableRows();pendingFreeTextClarification=true;addMessage(label,'user');addMessage('No problem. Type what the customer is trying to do. Helpful details: is it for a member, a staff/admin user, a booking, a payment, or a membership/billing task?','bot',[]);const input=document.getElementById('input');input.disabled=false;input.focus()}
function buildClarificationPayload(message){return 'Clarification answer: '+message}
function inferClarificationOptions(text){
  const lower=String(text||'').toLowerCase();
  const option=(label,value)=>({label,value:value||('Clarification answer: '+label)});
  if(lower.includes('full refund')&&lower.includes('partial refund')) return [option('Full Refund','This is a full refund'),option('Partial Refund','This is a partial refund')];
  if(lower.includes('brs payments')&&(lower.includes('yes')||lower.includes('taken through'))) return [option('Yes, BRS Payments','The payment was taken through BRS Payments'),option('No, other payment method','The payment was not taken through BRS Payments')];
  if(lower.includes('matching transaction')||lower.includes('transaction visible')||lower.includes('can you see a transaction')) return [option('Yes, transaction found','Yes, I found the matching transaction in BRS Payments'),option('No, no transaction found','No, I cannot find a matching transaction in BRS Payments')];
  if(lower.includes('payment symbol')||lower.includes('payment colour')||lower.includes('payment color')) return [option('Green - paid'),option('Blue - part paid'),option('Red - unpaid'),option('Yellow - overpaid')];
  if(lower.includes('member')&&lower.includes('visitor')&&lower.includes('competition')&&(lower.includes('refund')||lower.includes('refunded'))) return [option('Member competition purse','Clarification answer: Refund or adjust a member competition purse balance'),option('Visitor/open competition payment','Clarification answer: Refund a visitor or guest open competition payment'),option("I'm not sure / type details",'Clarification answer: I need to type details instead')];
  if(lower.includes('who')&&lower.includes('charging')&&lower.includes('competition')) return [option('Members','Clarification answer: Members competition charging through the competition purse'),option('Visitors','Clarification answer: Visitors open competition charging through green fee or entry fee setup'),option('Both','Clarification answer: Both members and visitors competition charging'),option("I'm not sure / type details",'Clarification answer: I need to type competition charging details')];
  if(lower.includes('members or visitors')||lower.includes('member or visitor')) return [option('Members','Clarification answer: Members'),option('Visitors','Clarification answer: Visitors'),option('Both','Clarification answer: Both members and visitors'),option("I'm not sure / type details",'Clarification answer: I need to type details instead')];
  if(lower.includes('admin')&&lower.includes('staff')&&lower.includes('member profile')) return [option('Admin or staff user','Clarification answer: Admin or staff user'),option('Member profile','Clarification answer: Member profile'),option("I'm not sure / type details",'Clarification answer: I need to type details instead')];
  return [];
}
function addOptionButtons(div,options){if(!options.length)return 0;const optionRow=document.createElement('div');optionRow.className='option-row';let freeTextAdded=false;for(const o of options){let label=o.label||String(o);let value=o.value||label;if(isFreeTextOption(label,value)){if(freeTextAdded)continue;freeTextAdded=true;label="I'm not sure / type details";value='Clarification answer: I need to type details instead'}const b=document.createElement('button');b.className='option-btn';b.type='button';b.textContent=label;b.onclick=()=>isFreeTextOption(label,value)?startFreeTextClarification(label):send(value,label);optionRow.appendChild(b)}div.appendChild(optionRow);activeOptionRow=optionRow;return options.length}
function getBotOptions(text,opts=[]){const provided=Array.isArray(opts)?opts:[];return provided.length?provided:inferClarificationOptions(text)}
function getFollowUpHint(text){const lower=String(text||'').toLowerCase();if(lower.includes('billing an individual member')&&lower.includes('for a group'))return 'The previous answer was about creating membership bills. The assistant asked whether the user wants steps for billing an individual member or for billing a group. Treat the next message as the answer to that choice, not as a new issue.';if(lower.includes('would you like')&&lower.includes('individual')&&lower.includes('group'))return 'The assistant asked the user to choose between individual and group steps. Treat the next message as a follow-up choice.';if(lower.includes('which')&&lower.includes('closest'))return 'The assistant asked the user to choose the closest support route. Treat the next message as a clarification answer.';if(lower.includes('can you add a bit more detail'))return 'The assistant asked for more detail about the current support issue. Treat the next message as a clarification, not a new issue.';return ''}
function addMessage(text,sender='bot',opts=[]){const chat=document.getElementById('chat');const row=document.createElement('div');row.className='msg-row '+(sender==='user'?'user-row':'bot-row');const wrap=document.createElement('div');wrap.className='msg-wrap';const div=document.createElement('div');div.className='msg '+sender;div.innerHTML=sender==='bot'?formatBotMessage(text):esc(text);let optionCount=0;if(sender==='bot'){optionCount=addOptionButtons(div,getBotOptions(text,opts));const hint=getFollowUpHint(text);if(hint)pendingFollowUpHint=hint}wrap.appendChild(div);row.appendChild(wrap);chat.appendChild(row);chat.scrollTop=chat.scrollHeight;return optionCount}
function sleep(ms){return new Promise(resolve=>setTimeout(resolve,ms))}
async function addMessageTyped(text,opts=[]){const chat=document.getElementById('chat');const row=document.createElement('div');row.className='msg-row bot-row';const wrap=document.createElement('div');wrap.className='msg-wrap';const div=document.createElement('div');div.className='msg bot typing-text';wrap.appendChild(div);row.appendChild(wrap);chat.appendChild(row);const message=String(text||'');const reduceMotion=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;if(reduceMotion){div.textContent=message}else{for(let i=0;i<message.length;i+=2){div.textContent=message.slice(0,i+2);chat.scrollTop=chat.scrollHeight;await sleep(message[i]==='\n'?90:12)}}div.classList.remove('typing-text');div.innerHTML=formatBotMessage(message);const optionCount=addOptionButtons(div,getBotOptions(message,opts));const hint=getFollowUpHint(message);if(hint)pendingFollowUpHint=hint;chat.scrollTop=chat.scrollHeight;return optionCount}
function showTyping(){removeTyping();const chat=document.getElementById('chat');typingRow=document.createElement('div');typingRow.className='msg-row bot-row';typingRow.innerHTML='<div class="msg-wrap"><div class="msg bot typing"><span></span><span></span><span></span></div></div>';chat.appendChild(typingRow);chat.scrollTop=chat.scrollHeight}
function removeTyping(){if(typingRow){typingRow.remove();typingRow=null}}
function handleKey(e){if(e.key==='Enter')send()}
async function send(m=null,d=null){if(isSending)return;const input=document.getElementById('input');let typed=m||input.value.trim();if(!typed)return;const followUpHint=!m&&!pendingFreeTextClarification?pendingFollowUpHint:'';const newQuestionIntent=!m&&!pendingFreeTextClarification&&!followUpHint&&hasPriorUserMessage()&&wantsNewQuestion(typed);if(newQuestionIntent){const nextQuestion=extractNewQuestion(typed);if(!nextQuestion){input.value='';startFreshPromptForNextQuestion(typed);input.focus();return}typed=nextQuestion}const shouldStartFresh=!m&&!pendingFreeTextClarification&&!followUpHint&&hasPriorUserMessage()&&(looksLikeStandaloneQuestion(typed)||newQuestionIntent);if(shouldStartFresh)startFreshSessionForRootQuestion();const message=pendingFreeTextClarification&&!m?buildClarificationPayload(typed):typed;pendingFreeTextClarification=false;disableRows();addMessage(d||typed,'user');input.value='';isSending=true;document.getElementById('sendBtn').disabled=true;input.disabled=true;showTyping();try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json','x-session-id':sessionId},body:JSON.stringify({message,contextHint:followUpHint})});pendingFollowUpHint='';const data=await r.json();removeTyping();const optionCount=await addMessageTyped(data.reply||'No response received.',data.options||[]);if(!optionCount&&!data.escalationReady)addResolutionPrompt()}catch(e){removeTyping();addMessage('There was a problem sending your message. Please try again.','bot')}isSending=false;document.getElementById('sendBtn').disabled=false;input.disabled=false;input.focus()}
