<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>BRS Support Agent</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230f172a'/%3E%3Ctext x='50' y='60' font-size='44' text-anchor='middle' fill='white' font-family='Arial' font-weight='700'%3EB%3C/text%3E%3C/svg%3E">

  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #eaf1fb;
      --surface: rgba(255, 255, 255, 0.88);
      --surface-solid: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: rgba(148, 163, 184, 0.28);
      --primary: #111827;
      --primary-2: #334155;
      --accent: #2563eb;
      --accent-soft: #dbeafe;
      --success: #16a34a;
      --chat-bg: #f8fafc;
      --shadow: 0 30px 90px rgba(15, 23, 42, 0.16);
      --card-shadow: 0 16px 45px rgba(15, 23, 42, 0.08);
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 8%, rgba(37, 99, 235, 0.18), transparent 32%),
        radial-gradient(circle at 88% 16%, rgba(14, 165, 233, 0.14), transparent 28%),
        linear-gradient(135deg, #eaf1fb, #f8fafc 52%, #eef2ff);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 28px;
    }

    .app {
      width: 100%;
      max-width: 1080px;
      height: 92vh;
      background: var(--surface);
      border: 1px solid rgba(255,255,255,0.68);
      border-radius: 32px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .header {
      padding: 22px 26px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: center;
      background: rgba(255,255,255,0.82);
    }

    .brand { display: flex; align-items: center; gap: 14px; }

    .mark {
      width: 46px;
      height: 46px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      color: white;
      display: grid;
      place-items: center;
      font-weight: 900;
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.22);
    }

    .title { font-size: 21px; font-weight: 850; letter-spacing: -0.02em; }
    .subtitle { margin-top: 4px; color: var(--muted); font-size: 14px; }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 13px;
      border-radius: 999px;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #166534;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: var(--success);
      border-radius: 999px;
      box-shadow: 0 0 0 5px rgba(22, 163, 74, 0.12);
    }

    #chat {
      flex: 1;
      padding: 28px;
      overflow-y: auto;
      background:
        linear-gradient(rgba(248,250,252,0.88), rgba(248,250,252,0.94)),
        radial-gradient(circle at 50% 0%, rgba(37, 99, 235, 0.07), transparent 36%);
    }

    .welcome-card {
      background: var(--surface-solid);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 22px;
      margin-bottom: 26px;
      box-shadow: var(--card-shadow);
    }

    .welcome-card h2 { margin: 0 0 8px; letter-spacing: -0.03em; }
    .welcome-card p { margin: 0; color: var(--muted); line-height: 1.6; }

    .msg-row { display: flex; margin-bottom: 18px; animation: slideIn 180ms ease-out; }
    .user-row { justify-content: flex-end; }
    .bot-row { justify-content: flex-start; }
    .msg-wrap { max-width: min(74%, 720px); }

    .msg {
      border-radius: 20px;
      font-size: 15px;
      line-height: 1.7;
    }

    .user {
      padding: 15px 18px;
      background: linear-gradient(135deg, var(--primary), #1f2937);
      color: white;
      border-bottom-right-radius: 7px;
      white-space: pre-wrap;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.18);
    }

    .bot {
      padding: 18px 20px;
      background: white;
      border: 1px solid var(--border);
      border-bottom-left-radius: 7px;
      box-shadow: var(--card-shadow);
    }

    .bot h3 { margin-top: 0; margin-bottom: 12px; font-size: 17px; }
    .bot p { margin: 0 0 12px; color: #1e293b; }
    .bot ol, .bot ul { margin: 10px 0 14px 22px; padding: 0; }
    .bot li { margin-bottom: 10px; padding-left: 4px; }
    .bot strong { color: #0f172a; }

    .typing {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-width: 74px;
      padding: 15px 18px;
    }

    .typing span {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #94a3b8;
      animation: bounce 1.1s infinite ease-in-out;
    }

    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.3s; }

    .input-wrap {
      padding: 16px;
      border-top: 1px solid var(--border);
      background: rgba(255,255,255,0.9);
    }

    .input {
      display: flex;
      gap: 10px;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: #f8fafc;
    }

    input {
      flex: 1;
      padding: 12px 14px;
      border-radius: 14px;
      border: none;
      background: transparent;
      font-size: 15px;
      outline: none;
      color: var(--text);
    }

    button {
      padding: 0 18px;
      border-radius: 14px;
      border: none;
      background: var(--primary);
      color: white;
      font-weight: 800;
      cursor: pointer;
      transition: transform 120ms ease, opacity 120ms ease, box-shadow 120ms ease;
    }

    button:hover { transform: translateY(-1px); box-shadow: 0 10px 22px rgba(15, 23, 42, 0.16); }
    button:disabled { opacity: 0.55; cursor: not-allowed; transform: none; box-shadow: none; }
    .reset-btn { background: #ffffff; color: var(--text); border: 1px solid var(--border); }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.45; }
      40% { transform: translateY(-5px); opacity: 1; }
    }

    @keyframes slideIn {
      from { transform: translateY(6px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @media (max-width: 720px) {
      body { padding: 12px; }
      .app { height: 96vh; border-radius: 24px; }
      .header { align-items: flex-start; flex-direction: column; padding: 18px; }
      #chat { padding: 18px; }
      .msg-wrap { max-width: 90%; }
      .input { flex-wrap: wrap; }
      input { min-width: 100%; }
      button { min-height: 42px; flex: 1; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="brand">
        <div class="mark">B</div>
        <div>
          <div class="title">BRS Support Agent</div>
          <div class="subtitle">Support guidance for bookings, payments, memberships and admin queries.</div>
        </div>
      </div>
      <div class="status-pill"><span class="dot"></span>Support Agent Online</div>
    </div>

    <div id="chat"></div>

    <div class="input-wrap">
      <div class="input">
        <input id="input" placeholder="Describe the customer issue..." onkeydown="handleKey(event)" />
        <button id="sendBtn" onclick="send()">Send</button>
        <button onclick="resetChat()" class="reset-btn">New Issue</button>
      </div>
    </div>
  </div>

<script>
const sessionId = localStorage.getItem("brsSupportSessionId") || crypto.randomUUID();
localStorage.setItem("brsSupportSessionId", sessionId);
let isSending = false;
let typingRow = null;

function formatBotMessage(text) {
  let formatted = text
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/^### (.*)$/gm, '<h3>$1</h3>');

  if (/\d+\./.test(text)) {
    const lines = text.split('\n').filter(Boolean);
    const listItems = lines
      .filter(line => /^\d+\./.test(line.trim()))
      .map(line => `<li>${line.replace(/^\d+\.\s*/, '')}</li>`)
      .join('');

    const intro = lines
      .filter(line => !/^\d+\./.test(line.trim()))
      .map(line => `<p>${line}</p>`)
      .join('');

    return `${intro}<ol>${listItems}</ol>`;
  }

  return `<p>${formatted.replace(/\n/g, '</p><p>')}</p>`;
}

function scrollChatToBottom() {
  const chat = document.getElementById('chat');
  chat.scrollTop = chat.scrollHeight;
}

function addMessage(text, sender = 'bot') {
  const chat = document.getElementById('chat');

  const row = document.createElement('div');
  row.className = `msg-row ${sender === 'user' ? 'user-row' : 'bot-row'}`;

  const wrap = document.createElement('div');
  wrap.className = 'msg-wrap';

  const message = document.createElement('div');
  message.className = `msg ${sender}`;

  if (sender === 'bot') {
    message.innerHTML = formatBotMessage(text);
  } else {
    message.textContent = text;
  }

  wrap.appendChild(message);
  row.appendChild(wrap);
  chat.appendChild(row);

  scrollChatToBottom();
}

function showTypingIndicator() {
  removeTypingIndicator();

  const chat = document.getElementById('chat');
  typingRow = document.createElement('div');
  typingRow.className = 'msg-row bot-row';
  typingRow.setAttribute('aria-live', 'polite');
  typingRow.innerHTML = `
    <div class="msg-wrap">
      <div class="msg bot typing" aria-label="Support Agent is typing">
        <span></span><span></span><span></span>
      </div>
    </div>
  `;

  chat.appendChild(typingRow);
  scrollChatToBottom();
}

function removeTypingIndicator() {
  if (typingRow) {
    typingRow.remove();
    typingRow = null;
  }
}

function setSendingState(sending) {
  isSending = sending;
  document.getElementById('sendBtn').disabled = sending;
  document.getElementById('input').disabled = sending;
}

function addWelcomeCard() {
  const chat = document.getElementById('chat');

  const card = document.createElement('div');
  card.className = 'welcome-card';
  card.innerHTML = `
    <h2>How can we help?</h2>
    <p>Describe the issue and we’ll guide the next best step. If needed, we can prepare an escalation draft for support.</p>
  `;

  chat.appendChild(card);
}

function handleKey(event) {
  if (event.key === 'Enter' && !isSending) {
    event.preventDefault();
    send();
  }
}

async function send() {
  if (isSending) return;

  const input = document.getElementById('input');
  const message = input.value.trim();

  if (!message) return;

  addMessage(message, 'user');
  input.value = '';
  setSendingState(true);
  showTypingIndicator();

  try {
    const response = await fetch('/api/chat', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-session-id': sessionId
      },
      body: JSON.stringify({ message })
    });

    if (!response.ok) {
      throw new Error('Failed to get response');
    }

    const data = await response.json();
    removeTypingIndicator();
    addMessage(data.reply || 'Support response received.', 'bot');
  } catch (error) {
    console.error(error);
    removeTypingIndicator();
    addMessage('There was a problem sending your message. Please try again.', 'bot');
  } finally {
    setSendingState(false);
    input.focus();
  }
}

function resetChat() {
  const chat = document.getElementById('chat');
  removeTypingIndicator();
  setSendingState(false);
  chat.innerHTML = '';
  addWelcomeCard();
}

addWelcomeCard();
</script>
</body>
</html>
