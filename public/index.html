<!DOCTYPE html>
<html>
<head>
  <title>BRS Support Assistant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #f4f6f8;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 100%;
      max-width: 900px;
      height: 90vh;
      background: white;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.12);
    }

    .header {
      padding: 18px 22px;
      border-bottom: 1px solid #e5e7eb;
      font-weight: 700;
      font-size: 18px;
    }

    #chat {
      flex: 1;
      padding: 22px;
      overflow-y: auto;
      background: #f9fafb;
    }

    .msg {
      padding: 12px 14px;
      margin-bottom: 14px;
      border-radius: 14px;
      max-width: 78%;
      line-height: 1.45;
      white-space: pre-wrap;
      font-size: 15px;
    }

    .user {
      background: #111827;
      color: white;
      margin-left: auto;
      border-bottom-right-radius: 5px;
    }

    .bot {
      background: white;
      color: #111827;
      border: 1px solid #dfe3e8;
      margin-right: auto;
      border-bottom-left-radius: 5px;
    }

    .input {
      display: flex;
      gap: 10px;
      padding: 16px;
      border-top: 1px solid #e5e7eb;
      background: white;
    }

    input {
      flex: 1;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #cfd6dd;
      font-size: 15px;
    }

    button {
      padding: 0 18px;
      border-radius: 12px;
      border: none;
      background: #111827;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    .reset-btn {
      background: #e5e7eb;
      color: #111827;
    }

    .email-preview {
      background: #f9fafb;
      border: 1px solid #d1d5db;
      border-radius: 14px;
      padding: 16px;
      margin: 12px 0 18px 0;
      white-space: pre-wrap;
      font-size: 14px;
      line-height: 1.5;
    }

    .email-preview strong {
      display: block;
      margin-bottom: 6px;
    }

    .escalation-container {
      margin-bottom: 18px;
    }

    .escalation-btn {
      display: inline-block;
      margin-top: 10px;
      padding: 12px 16px;
      background: #0f172a;
      color: white;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="header">BRS Support Assistant</div>

    <div id="chat"></div>

    <div class="input">
      <input id="input" placeholder="Ask a question..." onkeydown="handleKey(event)" />
      <button onclick="send()">Send</button>
      <button onclick="resetChat()" class="reset-btn">New Issue</button>
    </div>
  </div>

  <script>
    function addMessage(text, type) {
      const chat = document.getElementById("chat");
      const div = document.createElement("div");
      div.className = "msg " + type;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function addEscalationPreview(draft) {
      const chat = document.getElementById("chat");

      const container = document.createElement("div");
      container.className = "escalation-container";

      const preview = document.createElement("div");
      preview.className = "email-preview";

      preview.innerHTML = `
<strong>Escalation Email</strong>

<strong>To:</strong> ${draft.to || "support@brsgolf.com"}

<strong>Subject:</strong> ${draft.subject}

<strong>Body:</strong>
${draft.body}
`;

      container.appendChild(preview);

      const btn = document.createElement("div");
      btn.className = "escalation-btn";
      btn.textContent = "Send to Support";
      btn.onclick = sendEscalation;

      container.appendChild(btn);

      chat.appendChild(container);
      chat.scrollTop = chat.scrollHeight;
    }

    async function sendEscalation() {
      try {
        const res = await fetch("/send-escalation", {
          method: "POST",
          headers: { "Content-Type": "application/json" }
        });

        const data = await res.json();

        addMessage(data.message || "Escalation prepared.", "bot");

        if (data.draft) {
          addEscalationPreview(data.draft);
        }

      } catch {
        addMessage("Error sending escalation.", "bot");
      }
    }

    async function resetChat() {
      await fetch("/reset", { method: "POST" });
      document.getElementById("chat").innerHTML = "";
      addMessage("Starting fresh — what can I help with?", "bot");
    }

    function handleKey(e) {
      if (e.key === "Enter") send();
    }

    async function send() {
      const input = document.getElementById("input");
      const msg = input.value.trim();
      if (!msg) return;

      addMessage(msg, "user");
      input.value = "";

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: msg })
        });

        const data = await res.json();

        addMessage(data.reply, "bot");

        if (data.escalationReady && data.escalationDraft) {
          addEscalationPreview(data.escalationDraft);
        }

      } catch {
        addMessage("Error connecting to server.", "bot");
      }
    }

    addMessage("Starting fresh — what can I help with?", "bot");
  </script>
</body>
</html>
