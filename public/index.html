<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>BRS Support Assistant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230f172a'/%3E%3Ctext x='50' y='60' font-size='44' text-anchor='middle' fill='white' font-family='Arial' font-weight='700'%3EB%3C/text%3E%3C/svg%3E">

  <style>
    * { box-sizing: border-box; }

    :root {
      --bg: #eef3f9;
      --surface: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --primary: #0f172a;
      --primary-2: #1e293b;
      --accent: #2563eb;
      --accent-soft: #eff6ff;
      --success: #16a34a;
      --warning: #f59e0b;
      --shadow: 0 30px 90px rgba(15, 23, 42, 0.14);
      --card-shadow: 0 14px 40px rgba(15, 23, 42, 0.07);
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 10%, rgba(37, 99, 235, 0.12), transparent 30%),
        radial-gradient(circle at 85% 90%, rgba(15, 23, 42, 0.10), transparent 32%),
        linear-gradient(135deg, #eef3f9, #f8fafc);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 28px;
    }

    .app {
      width: 100%;
      max-width: 1040px;
      height: min(900px, 92vh);
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 32px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .header {
      padding: 24px 28px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, #ffffff, #f8fafc);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .mark {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      color: white;
      display: grid;
      place-items: center;
      font-weight: 900;
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.18);
    }

    .title {
      font-size: 22px;
      font-weight: 850;
      letter-spacing: -0.035em;
    }

    .subtitle {
      margin-top: 5px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid #bbf7d0;
      background: #f0fdf4;
      color: #166534;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .dot {
      width: 9px;
      height: 9px;
      background: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 0 5px rgba(22, 163, 74, 0.14);
    }

    #chat {
      flex: 1;
      padding: 32px;
      overflow-y: auto;
      background: linear-gradient(180deg, #f8fafc, #f1f5f9);
    }

    .welcome-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 22px;
      margin-bottom: 28px;
      box-shadow: var(--card-shadow);
    }

    .welcome-card h2 {
      margin: 0 0 8px;
      font-size: 20px;
      letter-spacing: -0.035em;
    }

    .welcome-card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
      font-size: 15px;
      max-width: 760px;
    }

    .msg-row {
      display: flex;
      margin-bottom: 24px;
    }

    .user-row { justify-content: flex-end; }
    .bot-row { justify-content: flex-start; }

    .msg-wrap {
      max-width: 72%;
    }

    .msg {
      border-radius: 22px;
      font-size: 15px;
      line-height: 1.55;
      box-shadow: var(--card-shadow);
    }

    .user {
      padding: 14px 17px;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      color: white;
      border-bottom-right-radius: 7px;
      white-space: pre-wrap;
    }

    .bot {
      background: white;
      color: var(--text);
      border: 1px solid var(--border);
      border-bottom-left-radius: 7px;
      overflow: hidden;
    }

    .answer-card {
      padding: 18px;
    }

    .answer-title {
      font-size: 16px;
      font-weight: 850;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

    .answer-intro {
      color: var(--muted);
      margin-bottom: 16px;
    }

    .path-card {
      border: 1px solid #dbeafe;
      background: var(--accent-soft);
      border-radius: 16px;
      padding: 14px 15px;
      margin: 14px 0;
    }

    .path-label {
      font-size: 12px;
      font-weight: 850;
      color: #1d4ed8;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 6px;
    }

    .path-value {
      font-weight: 800;
      color: #0f172a;
    }

    .steps {
      display: grid;
      gap: 10px;
      margin: 14px 0;
    }

    .step {
      display: flex;
      gap: 12px;
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: #f8fafc;
    }

    .step-num {
      width: 26px;
      height: 26px;
      border-radius: 999px;
      background: var(--primary);
      color: white;
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 900;
      flex: 0 0 auto;
      margin-top: 1px;
    }

    .step-text {
      flex: 1;
      color: var(--text);
      font-weight: 600;
    }

    .bullet-list {
      margin: 12px 0;
      display: grid;
      gap: 8px;
    }

    .bullet {
      display: flex;
      gap: 9px;
      color: var(--text);
    }

    .bullet::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      margin-top: 8px;
      flex: 0 0 auto;
    }

    .follow-up {
      margin-top: 16px;
      padding: 14px 15px;
      border-radius: 16px;
      background: #fff7ed;
      border: 1px solid #fed7aa;
      color: #7c2d12;
      font-weight: 750;
    }

    .plain-block {
      padding: 18px;
      white-space: pre-wrap;
    }

    .typing {
      display: inline-flex;
      gap: 5px;
      align-items: center;
      padding: 15px 17px;
    }

    .typing span {
      width: 7px;
      height: 7px;
      background: #94a3b8;
      border-radius: 50%;
      animation: pulse 1.2s infinite ease-in-out;
    }

    .typing span:nth-child(2) { animation-delay: 0.18s; }
    .typing span:nth-child(3) { animation-delay: 0.36s; }

    @keyframes pulse {
      0%, 80%, 100% { transform: scale(0.75); opacity: 0.35; }
      40% { transform: scale(1); opacity: 1; }
    }

    .input-wrap {
      padding: 18px 22px 20px;
      border-top: 1px solid var(--border);
      background: rgba(255,255,255,0.98);
    }

    .input {
      display: flex;
      gap: 10px;
      align-items: center;
      background: white;
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 9px;
      box-shadow: 0 12px 34px rgba(15, 23, 42, 0.07);
    }

    input {
      flex: 1;
      padding: 15px 14px;
      border: none;
      outline: none;
      background: transparent;
      font-size: 15px;
      color: var(--text);
      min-width: 120px;
    }

    input::placeholder { color: #94a3b8; }

    button {
      padding: 14px 19px;
      border-radius: 16px;
      border: none;
      background: var(--primary);
      color: white;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.14s ease, box-shadow 0.14s ease, opacity 0.14s ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.18);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .reset-btn {
      background: #f8fafc;
      color: var(--primary);
      border: 1px solid var(--border);
    }

    .footer-note {
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
      font-weight: 500;
    }

    .email-preview {
      background: white;
      border: 1px solid #cbd5e1;
      border-radius: 22px;
      padding: 20px;
      margin: 20px 0;
      white-space: pre-wrap;
      font-size: 14px;
      line-height: 1.6;
      box-shadow: var(--card-shadow);
    }

    .email-title {
      font-weight: 850;
      margin-bottom: 12px;
      font-size: 16px;
      letter-spacing: -0.02em;
    }

    .email-actions {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .escalation-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 18px;
      background: var(--accent);
      color: white;
      border-radius: 16px;
      cursor: pointer;
      font-weight: 850;
      box-shadow: 0 12px 30px rgba(37, 99, 235, 0.24);
      border: none;
    }

    @media (max-width: 760px) {
      body { padding: 0; }

      .app {
        height: 100vh;
        border-radius: 0;
      }

      .header { padding: 19px; }

      .subtitle { font-size: 13px; }

      .status-pill { display: none; }

      .mark {
        width: 38px;
        height: 38px;
      }

      #chat { padding: 18px; }

      .msg-wrap { max-width: 92%; }

      .input { flex-wrap: wrap; }

      button { flex: 1; }

      .footer-note { display: none; }
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="header">
      <div class="brand">
        <div class="mark">B</div>
        <div>
          <div class="title">BRS Support Assistant</div>
          <div class="subtitle">AI-assisted support for bookings, payments, memberships and admin queries.</div>
        </div>
      </div>

      <div class="status-pill">
        <span class="dot"></span>
        AI Assistant Online
      </div>
    </div>

    <div id="chat"></div>

    <div class="input-wrap">
      <div class="input">
        <input id="input" placeholder="Describe the customer issue..." onkeydown="handleKey(event)" />
        <button id="sendBtn" onclick="send()">Send</button>
        <button onclick="resetChat()" class="reset-btn">New Issue</button>
      </div>
      <div class="footer-note">Include the product area, customer issue and any checks already completed.</div>
    </div>
  </div>

  <script>
    function escapeHtml(text) {
      return String(text || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function cleanLine(line) {
      return line
        .replace(/^[-•]\s*/, "")
        .replace(/^Step\s*\d+\s*:\s*/i, "")
        .trim();
    }

    function parseAnswer(text) {
      const lines = String(text || "")
        .split("\n")
        .map(l => l.trim())
        .filter(Boolean);

      const result = {
        title: "",
        intro: "",
        path: "",
        steps: [],
        bullets: [],
        followUp: "",
        plain: text
      };

      const stepRegex = /^(step\s*\d+\s*:|\d+\.|- |• )/i;

      for (const raw of lines) {
        const line = raw.trim();

        if (!result.title && !stepRegex.test(line) && !line.includes(">>") && line.length < 90) {
          result.title = line.replace(/\.$/, "");
          continue;
        }

        if (/^(go to|please go to|navigate to):?/i.test(line) || line.includes(">>") || line.includes("→")) {
          result.path = line.replace(/^(go to|please go to|navigate to):?/i, "").trim();
          continue;
        }

        if (/^(step\s*\d+\s*:|\d+\.)/i.test(line)) {
          result.steps.push(cleanLine(line));
          continue;
        }

        if (/^[-•]\s*/.test(line)) {
          result.bullets.push(cleanLine(line));
          continue;
        }

        if (line.endsWith("?")) {
          result.followUp = line;
          continue;
        }

        if (!result.intro) {
          result.intro = line;
        } else if (line.length < 120) {
          result.bullets.push(line);
        } else {
          result.steps.push(line);
        }
      }

      if (!result.title && result.intro) {
        result.title = result.intro;
        result.intro = "";
      }

      return result;
    }

    function formatBotAnswer(text) {
      const parsed = parseAnswer(text);

      const hasStructure =
        parsed.title || parsed.intro || parsed.path || parsed.steps.length || parsed.bullets.length || parsed.followUp;

      if (!hasStructure) {
        return `<div class="plain-block">${escapeHtml(text)}</div>`;
      }

      let html = `<div class="answer-card">`;

      if (parsed.title) {
        html += `<div class="answer-title">${escapeHtml(parsed.title)}</div>`;
      }

      if (parsed.intro) {
        html += `<div class="answer-intro">${escapeHtml(parsed.intro)}</div>`;
      }

      if (parsed.path) {
        html += `
          <div class="path-card">
            <div class="path-label">Where to go</div>
            <div class="path-value">${escapeHtml(parsed.path)}</div>
          </div>
        `;
      }

      if (parsed.steps.length) {
        html += `<div class="steps">`;
        parsed.steps.forEach((step, index) => {
          html += `
            <div class="step">
              <div class="step-num">${index + 1}</div>
              <div class="step-text">${escapeHtml(step)}</div>
            </div>
          `;
        });
        html += `</div>`;
      }

      if (parsed.bullets.length) {
        html += `<div class="bullet-list">`;
        parsed.bullets.forEach(item => {
          html += `<div class="bullet">${escapeHtml(item)}</div>`;
        });
        html += `</div>`;
      }

      if (parsed.followUp) {
        html += `<div class="follow-up">${escapeHtml(parsed.followUp)}</div>`;
      }

      html += `</div>`;
      return html;
    }

    function addWelcomeCard() {
      const chat = document.getElementById("chat");
      const card = document.createElement("div");
      card.className = "welcome-card";
      card.innerHTML = `
        <h2>How can I help?</h2>
        <p>Describe the issue and I’ll guide the next best step. If needed, I can prepare an escalation draft for support.</p>
      `;
      chat.appendChild(card);
    }

    function addMessage(text, type) {
      const chat = document.getElementById("chat");

      const row = document.createElement("div");
      row.className = "msg-row " + (type === "user" ? "user-row" : "bot-row");

      const wrap = document.createElement("div");
      wrap.className = "msg-wrap";

      const div = document.createElement("div");
      div.className = "msg " + type;

      if (type === "bot") {
        div.innerHTML = formatBotAnswer(text);
      } else {
        div.textContent = text;
      }

      wrap.appendChild(div);
      row.appendChild(wrap);
      chat.appendChild(row);
      chat.scrollTop = chat.scrollHeight;
    }

    function showTyping() {
      const chat = document.getElementById("chat");

      const row = document.createElement("div");
      row.className = "msg-row bot-row";
      row.id = "typingRow";

      const wrap = document.createElement("div");
      wrap.className = "msg-wrap";

      const div = document.createElement("div");
      div.className = "msg bot typing";
      div.innerHTML = "<span></span><span></span><span></span>";

      wrap.appendChild(div);
      row.appendChild(wrap);
      chat.appendChild(row);
      chat.scrollTop = chat.scrollHeight;
    }

    function removeTyping() {
      const row = document.getElementById("typingRow");
      if (row) row.remove();
    }

    function addEscalationPreview(draft) {
      const chat = document.getElementById("chat");

      const preview = document.createElement("div");
      preview.className = "email-preview";

      preview.innerHTML = `
<div class="email-title">Ready to escalate</div>
<strong>To:</strong> ${escapeHtml(draft.to || "support@brsgolf.com")}

<strong>Subject:</strong> ${escapeHtml(draft.subject)}

<strong>Body:</strong>
${escapeHtml(draft.body)}
`;

      chat.appendChild(preview);

      const actions = document.createElement("div");
      actions.className = "email-actions";

      const sendBtn = document.createElement("button");
      sendBtn.className = "escalation-btn";
      sendBtn.textContent = "Send to Support";
      sendBtn.onclick = sendEscalation;

      actions.appendChild(sendBtn);
      chat.appendChild(actions);
      chat.scrollTop = chat.scrollHeight;
    }

    async function sendEscalation() {
      try {
        const res = await fetch("/send-escalation", {
          method: "POST",
          headers: { "Content-Type": "application/json" }
        });

        const data = await res.json();
        addMessage(data.message || "Escalation prepared.", "bot");

      } catch {
        addMessage("Unable to send escalation. Please try again.", "bot");
      }
    }

    async function resetChat() {
      await fetch("/reset", { method: "POST" });
      document.getElementById("chat").innerHTML = "";
      addWelcomeCard();
      addMessage("What issue can I help you with?", "bot");
      document.getElementById("input").focus();
    }

    function handleKey(e) {
      if (e.key === "Enter") send();
    }

    async function send() {
      const input = document.getElementById("input");
      const btn = document.getElementById("sendBtn");
      const msg = input.value.trim();

      if (!msg) return;

      addMessage(msg, "user");
      input.value = "";
      btn.disabled = true;
      input.disabled = true;

      showTyping();

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: msg })
        });

        const data = await res.json();

        removeTyping();
        addMessage(data.reply || "No response received.", "bot");

        if (data.escalationReady && data.escalationDraft) {
          addEscalationPreview(data.escalationDraft);
        }

      } catch {
        removeTyping();
        addMessage("Error connecting to server. Please refresh and try again.", "bot");
      }

      btn.disabled = false;
      input.disabled = false;
      input.focus();
    }

    addWelcomeCard();
    addMessage("What issue can I help you with?", "bot");
  </script>
</body>
</html>
