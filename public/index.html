<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>BRS Support Assistant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230f172a'/%3E%3Ctext x='50' y='60' font-size='44' text-anchor='middle' fill='white' font-family='Arial' font-weight='700'%3EB%3C/text%3E%3C/svg%3E">

  <style>
    * { box-sizing: border-box; }

    :root {
      --bg: #eef3f9;
      --surface: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --primary: #0f172a;
      --primary-2: #1e293b;
      --accent: #2563eb;
      --success: #16a34a;
      --shadow: 0 30px 90px rgba(15, 23, 42, 0.14);
      --card-shadow: 0 14px 40px rgba(15, 23, 42, 0.07);
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 10%, rgba(37, 99, 235, 0.08), transparent 30%),
        linear-gradient(135deg, #eef3f9, #f8fafc);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 28px;
    }

    .app {
      width: 100%;
      max-width: 1040px;
      height: 92vh;
      background: rgba(255, 255, 255, 0.96);
      border-radius: 28px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .header {
      padding: 22px 26px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: white;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .mark {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      color: white;
      display: grid;
      place-items: center;
      font-weight: 900;
    }

    .title {
      font-size: 20px;
      font-weight: 800;
    }

    .subtitle {
      margin-top: 4px;
      color: var(--muted);
      font-size: 14px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #166534;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: var(--success);
      border-radius: 999px;
      box-shadow: 0 0 0 4px rgba(22, 163, 74, 0.14);
    }

    #chat {
      flex: 1;
      padding: 26px;
      overflow-y: auto;
      background: #f8fafc;
    }

    .welcome-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 20px;
      margin-bottom: 24px;
      box-shadow: var(--card-shadow);
    }

    .welcome-card h2 {
      margin: 0 0 8px;
      font-size: 20px;
      letter-spacing: -0.03em;
    }

    .welcome-card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
      font-size: 15px;
    }

    .msg-row {
      display: flex;
      margin-bottom: 20px;
    }

    .user-row { justify-content: flex-end; }
    .bot-row { justify-content: flex-start; }

    .msg-wrap {
      max-width: 70%;
    }

    .msg {
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.6;
    }

    .user {
      padding: 14px 16px;
      background: var(--primary);
      color: white;
      border-bottom-right-radius: 6px;
      white-space: pre-wrap;
    }

    .bot {
      background: white;
      border: 1px solid var(--border);
      border-bottom-left-radius: 6px;
      box-shadow: var(--card-shadow);
      overflow: hidden;
    }

    .answer-card {
      padding: 16px;
    }

    .answer-title {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .answer-intro {
      color: var(--muted);
      margin-bottom: 14px;
    }

    .answer-intro:empty {
      display: none;
    }

    .path-card {
      border: 1px solid #e2e8f0;
      background: #f8fafc;
      border-radius: 14px;
      padding: 12px 13px;
      margin: 12px 0 14px;
    }

    .path-label {
      font-size: 11px;
      font-weight: 800;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 5px;
    }

    .path-value {
      font-weight: 750;
      color: #0f172a;
    }

    .steps {
      display: grid;
      gap: 10px;
      margin: 12px 0;
    }

    .step {
      display: flex;
      gap: 10px;
      padding: 12px;
      border-radius: 14px;
      background: #f8fafc;
      border: 1px solid var(--border);
    }

    .step-num {
      width: 24px;
      height: 24px;
      border-radius: 999px;
      background: var(--primary);
      color: white;
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 800;
      flex: 0 0 auto;
    }

    .step-text {
      font-weight: 600;
    }

    .bullet-list {
      margin: 14px 0;
      display: grid;
      gap: 10px;
    }

    .bullet {
      display: flex;
      gap: 10px;
      color: var(--text);
      line-height: 1.55;
    }

    .bullet::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #64748b;
      margin-top: 9px;
      flex: 0 0 auto;
    }

    .follow-up {
      margin-top: 12px;
      padding: 14px 16px;
      border-radius: 16px;
      background: white;
      border: 1px solid var(--border);
      color: var(--primary);
      font-weight: 800;
      box-shadow: var(--card-shadow);
    }

    .quick-replies {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .quick-reply-btn {
      padding: 10px 14px;
      border-radius: 999px;
      background: #f1f5f9;
      color: var(--text);
      border: 1px solid var(--border);
      font-size: 13px;
      font-weight: 800;
    }

    .quick-reply-btn:hover {
      background: #e2e8f0;
    }

    .typing {
      display: inline-flex;
      gap: 5px;
      align-items: center;
      padding: 15px 17px;
    }

    .typing span {
      width: 7px;
      height: 7px;
      background: #94a3b8;
      border-radius: 50%;
      animation: pulse 1.2s infinite ease-in-out;
    }

    .typing span:nth-child(2) { animation-delay: 0.18s; }
    .typing span:nth-child(3) { animation-delay: 0.36s; }

    @keyframes pulse {
      0%, 80%, 100% { transform: scale(0.75); opacity: 0.35; }
      40% { transform: scale(1); opacity: 1; }
    }

    .input-wrap {
      padding: 16px;
      border-top: 1px solid var(--border);
      background: white;
    }

    .input {
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid var(--border);
      font-size: 14px;
      outline: none;
    }

    input:focus {
      border-color: #94a3b8;
    }

    button {
      padding: 0 18px;
      border-radius: 14px;
      border: none;
      background: var(--primary);
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .reset-btn {
      background: #f1f5f9;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .footer-note {
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
      font-weight: 500;
    }

    .email-preview {
      background: white;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      margin: 18px 0;
      white-space: pre-wrap;
      font-size: 14px;
      line-height: 1.6;
      box-shadow: var(--card-shadow);
    }

    .escalation-btn {
      padding: 14px 18px;
      background: var(--accent);
      color: white;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 800;
      border: none;
      margin-bottom: 18px;
    }

    @media (max-width: 760px) {
      body { padding: 0; }

      .app {
        height: 100vh;
        border-radius: 0;
      }

      .header {
        padding: 18px;
      }

      .subtitle {
        font-size: 13px;
      }

      .status-pill {
        display: none;
      }

      #chat {
        padding: 18px;
      }

      .msg-wrap {
        max-width: 92%;
      }

      .input {
        flex-wrap: wrap;
      }

      button {
        flex: 1;
        padding: 14px;
      }

      .quick-replies {
        flex-direction: column;
      }

      .footer-note {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="header">
      <div class="brand">
        <div class="mark">B</div>
        <div>
          <div class="title">BRS Support Assistant</div>
          <div class="subtitle">AI-assisted support for bookings, payments, memberships and admin queries.</div>
        </div>
      </div>

      <div class="status-pill">
        <span class="dot"></span>
        AI Assistant Online
      </div>
    </div>

    <div id="chat"></div>

    <div class="input-wrap">
      <div class="input">
        <input id="input" placeholder="Describe the customer issue..." onkeydown="handleKey(event)" />
        <button id="sendBtn" onclick="send()">Send</button>
        <button onclick="resetChat()" class="reset-btn">New Issue</button>
      </div>
      <div class="footer-note">Include the product area, customer issue and any checks already completed.</div>
    </div>
  </div>

  <script>
    function escapeHtml(text) {
      return String(text || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function cleanLine(line) {
      return line
        .replace(/^[-•]\s*/, "")
        .replace(/^Step\s*\d+\s*:\s*/i, "")
        .replace(/^\d+\.\s*/, "")
        .trim();
    }

    function addWelcomeCard() {
      const chat = document.getElementById("chat");
      const card = document.createElement("div");
      card.className = "welcome-card";
      card.innerHTML = `
        <h2>How can I help?</h2>
        <p>Describe the issue and I’ll guide the next best step. If needed, I can prepare an escalation draft for support.</p>
      `;
      chat.appendChild(card);
    }

    function uniqueOptions(options) {
      const seen = new Set();
      return options
        .map(option => String(option || "").replace(/[?.!]+$/g, "").trim())
        .filter(option => option.length > 0 && option.length <= 40)
        .filter(option => {
          const key = option.toLowerCase();
          if (seen.has(key)) return false;
          seen.add(key);
          return true;
        })
        .slice(0, 6);
    }

    function titleCaseOption(option) {
      return option
        .trim()
        .replace(/\s+/g, " ")
        .replace(/\b\w/g, char => char.toUpperCase());
    }

    function getChoiceOptions(question) {
      const q = String(question || "").replace(/\?$/, "").trim();
      if (!/\s+or\s+/i.test(q)) return [];

      const explicitChoiceMatch = q.match(/(?:is this|is it|was this|was it|should this be|would this be|do you need|are you asking for|what type of|which type of|is the refund|refund is)\s+(?:a\s+|an\s+|the\s+)?(.+?)\s+or\s+(?:a\s+|an\s+|the\s+)?(.+)$/i);
      if (explicitChoiceMatch) {
        const suffixMatch = explicitChoiceMatch[2].match(/\b(refund|booking|payment|membership|user|admin|issue|query|case|request)\b/i);
        const suffix = suffixMatch ? suffixMatch[1].toLowerCase() : "";
        const firstOption = suffix && !new RegExp(`\\b${suffix}\\b`, "i").test(explicitChoiceMatch[1])
          ? `${explicitChoiceMatch[1]} ${suffix}`
          : explicitChoiceMatch[1];

        return uniqueOptions([firstOption, explicitChoiceMatch[2]].map(titleCaseOption));
      }

      const parts = q
        .split(/\s+or\s+/i)
        .map(part => part.replace(/^(which|what|is|are|was|were|do|does|did|can|could|should|has|have|had|will|would)\b\s*/i, ""))
        .map(part => part.replace(/^(this|it|the|a|an)\b\s*/i, ""))
        .map(titleCaseOption);

      return uniqueOptions(parts);
    }

    function getQuickReplyOptions(question) {
      const q = String(question || "").trim();
      const lower = q.toLowerCase();

      if (!q.endsWith("?")) return [];

      const choiceOptions = getChoiceOptions(q);
      if (choiceOptions.length > 1) return choiceOptions;

      if (/\b(product area|area|module|category)\b/.test(lower)) {
        return ["Bookings", "Tee Sheet", "Payments", "Memberships", "Admin", "User Management"];
      }

      if (/\b(escalat|send to support|raise.*support)\b/.test(lower)) {
        return ["Yes, escalate", "No, continue troubleshooting"];
      }

      if (/^(is|are|was|were|do|does|did|can|could|should|has|have|had|will|would)\b/.test(lower)) {
        return ["Yes", "No"];
      }

      return [];
    }

    function quickReplyHtml(question) {
      const options = getQuickReplyOptions(question);
      if (!options.length) return "";

      const buttons = options.map(option => {
        const encoded = encodeURIComponent(option);
        return `<button class="quick-reply-btn" type="button" onclick="sendQuickReply(decodeURIComponent('${encoded}'))">${escapeHtml(option)}</button>`;
      }).join("");

      return `<div class="quick-replies">${buttons}</div>`;
    }

    function parseAnswer(text) {
      const lines = String(text || "")
        .split("\n")
        .map(l => l.trim())
        .filter(Boolean);

      const result = {
        title: "",
        intro: "",
        path: "",
        steps: [],
        bullets: [],
        followUp: ""
      };

      for (const raw of lines) {
        const line = raw.trim();

        if (/^then:?$/i.test(line)) continue;

        if (!result.title && line.length < 90 && !line.includes(">>") && !line.endsWith("?")) {
          result.title = line.replace(/\.$/, "");
          continue;
        }

        if (/^(go to|please go to|navigate to):?/i.test(line) || line.includes(">>")) {
          result.path = line.replace(/^(go to|please go to|navigate to):?/i, "").trim();
          continue;
        }

        if (/^\d+\./.test(line) || /^step\s*\d+/i.test(line)) {
          result.steps.push(cleanLine(line));
          continue;
        }

        if (/^[-•]/.test(line)) {
          result.bullets.push(cleanLine(line));
          continue;
        }

        if (line.endsWith("?")) {
          result.followUp = line;
          continue;
        }

        if (!result.intro) {
          result.intro = line;
        } else {
          result.bullets.push(line);
        }
      }

      return result;
    }

    function formatBotAnswer(text) {
      const parsed = parseAnswer(text);

      let html = `<div class="answer-card">`;

      if (parsed.title) {
        html += `<div class="answer-title">${escapeHtml(parsed.title)}</div>`;
      }

      if (parsed.intro) {
        html += `<div class="answer-intro">${escapeHtml(parsed.intro)}</div>`;
      }

      if (parsed.path) {
        html += `
          <div class="path-card">
            <div class="path-label">Where to go</div>
            <div class="path-value">${escapeHtml(parsed.path)}</div>
          </div>
        `;
      }

      if (parsed.steps.length) {
        html += `<div class="steps">`;
        parsed.steps.forEach((step, i) => {
          html += `
            <div class="step">
              <div class="step-num">${i + 1}</div>
              <div class="step-text">${escapeHtml(step)}</div>
            </div>
          `;
        });
        html += `</div>`;
      }

      if (parsed.bullets.length) {
        html += `<div class="bullet-list">`;
        parsed.bullets.forEach(b => {
          html += `<div class="bullet">${escapeHtml(b)}</div>`;
        });
        html += `</div>`;
      }

      html += `</div>`;

      if (parsed.followUp) {
        html += `<div class="follow-up">${escapeHtml(parsed.followUp)}${quickReplyHtml(parsed.followUp)}</div>`;
      }

      return html;
    }

    function addMessage(text, type) {
      const chat = document.getElementById("chat");

      const row = document.createElement("div");
      row.className = "msg-row " + (type === "user" ? "user-row" : "bot-row");

      const wrap = document.createElement("div");
      wrap.className = "msg-wrap";

      const div = document.createElement("div");
      div.className = "msg " + type;

      if (type === "bot") {
        div.innerHTML = formatBotAnswer(text);
      } else {
        div.textContent = text;
      }

      wrap.appendChild(div);
      row.appendChild(wrap);
      chat.appendChild(row);
      chat.scrollTop = chat.scrollHeight;
    }

    function showTyping() {
      const chat = document.getElementById("chat");

      const row = document.createElement("div");
      row.className = "msg-row bot-row";
      row.id = "typingRow";

      const wrap = document.createElement("div");
      wrap.className = "msg-wrap";

      const div = document.createElement("div");
      div.className = "msg bot typing";
      div.innerHTML = "<span></span><span></span><span></span>";

      wrap.appendChild(div);
      row.appendChild(wrap);
      chat.appendChild(row);
      chat.scrollTop = chat.scrollHeight;
    }

    function removeTyping() {
      const row = document.getElementById("typingRow");
      if (row) row.remove();
    }

    function addEscalationPreview(draft) {
      const chat = document.getElementById("chat");

      const preview = document.createElement("div");
      preview.className = "email-preview";

      preview.innerHTML = `
<strong>Escalation Email</strong>

<strong>To:</strong> ${escapeHtml(draft.to || "support@brsgolf.com")}

<strong>Subject:</strong> ${escapeHtml(draft.subject)}

<strong>Body:</strong>
${escapeHtml(draft.body)}
`;

      chat.appendChild(preview);

      const btn = document.createElement("button");
      btn.className = "escalation-btn";
      btn.textContent = "Send to Support";
      btn.onclick = sendEscalation;

      chat.appendChild(btn);
      chat.scrollTop = chat.scrollHeight;
    }

    async function sendEscalation() {
      try {
        const res = await fetch("/send-escalation", {
          method: "POST",
          headers: { "Content-Type": "application/json" }
        });

        const data = await res.json();
        addMessage(data.message || "Escalation prepared.", "bot");

      } catch {
        addMessage("Error sending escalation.", "bot");
      }
    }

    async function resetChat() {
      await fetch("/reset", { method: "POST" });
      document.getElementById("chat").innerHTML = "";
      addWelcomeCard();
      addMessage("What issue can I help you with?", "bot");
      document.getElementById("input").focus();
    }

    function handleKey(e) {
      if (e.key === "Enter") send();
    }

    async function sendQuickReply(value) {
      const input = document.getElementById("input");
      input.value = value;
      await send();
    }

    async function send() {
      const input = document.getElementById("input");
      const btn = document.getElementById("sendBtn");
      const msg = input.value.trim();

      if (!msg) return;

      addMessage(msg, "user");
      input.value = "";
      btn.disabled = true;
      input.disabled = true;

      showTyping();

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: msg })
        });

        const data = await res.json();

        removeTyping();
        addMessage(data.reply || "No response received.", "bot");

        if (data.escalationReady && data.escalationDraft) {
          addEscalationPreview(data.escalationDraft);
        }

      } catch {
        removeTyping();
        addMessage("Error connecting to server. Please refresh and try again.", "bot");
      }

      btn.disabled = false;
      input.disabled = false;
      input.focus();
    }

    addWelcomeCard();
    addMessage("What issue can I help you with?", "bot");
  </script>
</body>
</html>
